  # Discovery job to dynamically get list of registered models and orchestrators
  discover-models:
    name: Discover Model Fixtures and Orchestrators
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.discover.outputs.models }}
      orchestrators: ${{ steps.discover.outputs.orchestrators }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package to register entry points
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
      - name: Discover models and orchestrators
        id: discover
        run: |
          python .github/scripts/discover_models.py --output models > models.json
          echo "models=$(cat models.json)" >> $GITHUB_OUTPUT

          python .github/scripts/discover_models.py --output orchestrators > orchestrators.json
          echo "orchestrators=$(cat orchestrators.json)" >> $GITHUB_OUTPUT

          echo "Models:"
          cat models.json
          echo ""
          echo "Orchestrators:"
          cat orchestrators.json

