  # Status and output jobs
  post-status:
    name: Post Status for other jobs
    needs: [lint_and_format, test-unit-3-9, test-unit-3-10, test-unit-3-11, test-unit-3-12, test-integration-matrix-3-9, test-integration-matrix-3-10, test-integration-matrix-3-11, test-integration-matrix-3-12, test-doctest-3-9, test-doctest-3-10, test-doctest-3-11, test-doctest-3-12]
    runs-on: ubuntu-latest
    steps:
      - name: Set output for lint and test status
        id: set-output
        run: |
          echo "::set-output name=test_status::success"
          echo "::set-output name=lint_status::success"
          echo "lint_status=success" >> $GITHUB_ENV
          echo "test_status=success" >> $GITHUB_ENV
          echo "lint_status=success" >> $GITHUB_OUTPUT
          echo "test_status=success" >> $GITHUB_OUTPUT
  set-output:
    name: Set Output for Ref
    runs-on: ubuntu-latest
    needs: [lint_and_format, test-unit-3-9, test-unit-3-10, test-unit-3-11, test-unit-3-12, test-integration-matrix-3-9, test-integration-matrix-3-10, test-integration-matrix-3-11, test-integration-matrix-3-12, test-doctest-3-9, test-doctest-3-10, test-doctest-3-11, test-doctest-3-12]
    outputs:
      ref: ${{ steps.set-ref.outputs.ref }}
      is_tag: ${{ steps.set-ref.outputs.is_tag }}
    steps:
      - name: Determine if Ref is a Tag
        id: set-ref
        run: |
          echo "ref=${GITHUB_REF}" >> $GITHUB_OUTPUT
          if [[ "${GITHUB_REF}" =~ ^refs/tags/ ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi
          echo "cat ${GITHUB_OUTPUT}"
          cat $GITHUB_OUTPUT
  generate-test-matrix-table:
    name: Generate Test Matrix Status Table
    runs-on: ubuntu-latest
    needs: [discover-models, test-integration-matrix-3-9, test-integration-matrix-3-10, test-integration-matrix-3-11, test-integration-matrix-3-12]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Generate matrix status tables
        env:
          MODELS_JSON: ${{ needs.discover-models.outputs.models }}
          ORCHESTRATORS_JSON: ${{ needs.discover-models.outputs.orchestrators }}
          PY39_RESULT: ${{ needs.test-integration-matrix-3-9.result }}
          PY310_RESULT: ${{ needs.test-integration-matrix-3-10.result }}
          PY311_RESULT: ${{ needs.test-integration-matrix-3-11.result }}
          PY312_RESULT: ${{ needs.test-integration-matrix-3-12.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Parse model list and orchestrator configs from discovery job
          MODELS=$(echo "$MODELS_JSON" | jq -r '.[]')
          ORCHESTRATOR_IDS=$(echo "$ORCHESTRATORS_JSON" | jq -r '.[].id')

          # Function to get job status for specific combination
          get_status() {
            local py_version=$1
            local model=$2
            local orch=$3
            local cmip=$4

            # Query GitHub API for job status
            # Job name format: "Integration 3.X / model / cmipY / orch"
            local job_name="Integration ${py_version} / ${model} / ${cmip} / ${orch}"

            # Get the job status from this workflow run
            local status=$(gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
              --jq ".jobs[] | select(.name == \"${job_name}\") | .conclusion")

            if [ "$status" == "success" ]; then
              echo "✅"
            elif [ "$status" == "failure" ]; then
              echo "❌"
            elif [ "$status" == "cancelled" ]; then
              echo "⏸️"
            elif [ "$status" == "skipped" ]; then
              echo "⏭️"
            else
              echo "⏳"
            fi
          }

          # Generate tables
          cat > test-matrix-status.md << 'TABLE_START'
          ## Integration Test Matrix Status

          TABLE_START

          for py_ver in "3.9" "3.10" "3.11" "3.12"; do
            py_ver_nodot=$(echo $py_ver | tr -d '.')

            echo "" >> test-matrix-status.md
            echo "### Python ${py_ver}" >> test-matrix-status.md
            echo "" >> test-matrix-status.md
            echo "| Model / Orchestrator | CMIP6 | CMIP7 |" >> test-matrix-status.md
            echo "|---------------------|-------|-------|" >> test-matrix-status.md

            for model in $MODELS; do
              for orch in $ORCHESTRATOR_IDS; do
                cmip6_status=$(get_status "$py_ver" "$model" "$orch" "cmip6")
                cmip7_status=$(get_status "$py_ver" "$model" "$orch" "cmip7")
                echo "| ${model} / ${orch} | ${cmip6_status} | ${cmip7_status} |" >> test-matrix-status.md
              done
            done
          done

          echo "" >> test-matrix-status.md
          echo "---" >> test-matrix-status.md
          echo "*Generated automatically by the CI workflow*" >> test-matrix-status.md

          cat test-matrix-status.md
      - name: Post comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body-file test-matrix-status.md \
            --repo ${{ github.repository }}
  set-workflow-artifact:
    name: Set workflow artifact
    runs-on: ubuntu-latest
    needs: set-output
    steps:
      - name: Create artifact
        run: |
          echo "Creating artifact..."
          echo "ref=$REF"
          echo "is_tag=$IS_TAG"
          echo "ref=$REF" >> status.dat
          echo "is_tag=$IS_TAG" >> status.dat
        env:
          REF: ${{ needs.set-output.outputs.ref }}
          IS_TAG: ${{ needs.set-output.outputs.is_tag }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ github.run_id }}
          path: status.dat
  # Combined test coverage report
  coverage:
    name: Generate Coverage Report
    needs: [test-meta-3-9, test-meta-3-10, test-meta-3-11, test-meta-3-12, test-unit-3-9, test-unit-3-10, test-unit-3-11, test-unit-3-12, test-integration-matrix-3-9, test-integration-matrix-3-10, test-integration-matrix-3-11, test-integration-matrix-3-12, test-doctest-3-9, test-doctest-3-10, test-doctest-3-11, test-doctest-3-12]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov coverage
      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          path: coverage-reports
      - name: Process coverage reports
        run: |
          # Create directories for each Python version and test type
          mkdir -p coverage-output/3.9 coverage-output/3.10 coverage-output/3.11 coverage-output/3.12
          # Copy coverage reports to their respective directories
          for version in 3.9 3.10 3.11 3.12; do
            # Combine all coverage reports for each version
            for type in meta unit integration doctest; do
              if [ -f "coverage-reports/coverage-reports-${type}-${version}/coverage-${type}-${version}.xml" ]; then
                cp coverage-reports/coverage-reports-${type}-${version}/coverage-${type}-${version}.xml coverage-output/${version}/coverage-${type}.xml
              fi
            done
          done
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          directory: ./coverage-output/
          fail_ci_if_error: false
          flags: python-3.9,python-3.10,python-3.11,python-3.12
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: esm-tools/pycmor
