# Bench v14: slab_size=120 + single-output-file append.
# Combines v12 (single-file append) with v13 (large slab). Should be the
# Pareto winner if append overhead is small AND large slabs amortize the
# per-slab cost.

general:
  name: "hr-uas-1hr-bench-v16"
  cmor_version: "CMIP7"
  mip: "CMIP"
  CMIP7_DReq_metadata: "/home/a/a270092/.cache/pycmor/cmip7_metadata/v1.2.2.3/metadata.json"

pycmor:
  enable_output_subdirs: true
  warn_on_no_rule: False
  parallel: False
  dask_cluster: "local"
  dask_n_workers: 1
  dask_threads_per_worker: 1
  dask_memory_limit: 200GB

inherit:
  data_path: &dp /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/oifs
  source_id: AWI-ESM3-4-2-veg-HR
  institution_id: AWI
  experiment_id: piControl
  parent_experiment_id: no parent
  variant_label: r1i1p1f1
  grid_label: g122
  grid: "OpenIFS TCo319 reduced Gaussian"
  nominal_resolution: "25 km"
  institution: "Alfred Wegener Institute for Polar and Marine Research"
  time_dimname: time_counter
  output_directory: ./cmorized_output/bench_hr_uas_1hr_v16_v14

pipelines:
  - name: bench_uas_1hr_pipeline_v16
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - script://$PYCMOR_HOME/examples/bench_rechunk.py:save_dataset_per_slab

      - pycmor.std_lib.qc.run_compliance_checker
rules:
  - name: uas_1hr
    inputs:
      - path: *dp
        pattern: atmos_1h_pt_10u_1587-1587\.nc
    compound_name: atmos.uas.tpt-h10m-hxy-u.1hr.glb
    model_variable: 10u
    lazy_write: true
    netcdf_compression_codec: blosc_zstd
    netcdf_compression_level: 3
    slab_size: 720
    pipelines:
      - bench_uas_1hr_pipeline_v16
