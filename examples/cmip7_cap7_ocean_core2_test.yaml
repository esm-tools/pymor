# CMIP7 CAP7 Ocean Variables — Test config with CORE2 mesh
# Adapted from awi-esm3-veg-hr-variables/cap7_ocean/cmip7_awiesm3-veg-hr_cap7_ocean.yaml
# Uses low-resolution CORE2 (~100km, 126858 nodes) experiment for quick testing.
# 9 rules: tossq_day, volcello_mon, friver, hfx, hfxint, hfy, hfyint, tauuo_mon, tauvo_mon

general:
  name: "awiesm3-cmip7-cap7-ocean-core2-test"
  cmor_version: "CMIP7"
  mip: "CMIP"
  CMIP7_DReq_metadata: "/home/a/a270092/.cache/pycmor/cmip7_metadata/v1.2.2.2/metadata.json"

pycmor:
  warn_on_no_rule: False
  parallel: False
  dask_cluster: "slurm"
  dask_cluster_scaling_mode: "fixed"
  dask_cluster_scaling_fixed_jobs: 1

jobqueue:
  slurm:
    name: pycmor-worker
    queue: compute
    account: ba0989
    cores: 16
    memory: 256GB
    walltime: '00:30:00'

pipelines:
  # Square a field (reuse pattern from lrcs_ocean square_pipeline)
  - name: square_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script:///work/ab0246/a270092/software/pycmor/examples/custom_steps.py:compute_square
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # Scale by constant (m/s → kg m-2 s-1 via ×1000)
  - name: scale_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script:///work/ab0246/a270092/software/pycmor/examples/custom_steps.py:scale_by_constant
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # Time-varying volcello: hnode (layer thickness) × cell_area
  - name: volcello_time_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script:///work/ab0246/a270092/software/pycmor/examples/custom_steps.py:compute_volcello_time
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # Surface extraction from 3D field (uos, vos)
  - name: surface_extract_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script:///work/ab0246/a270092/software/pycmor/examples/custom_steps.py:extract_surface
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # Ofx: load grid file, extract variable
  # Scale by constant then vertically integrate (hfxint, hfyint)
  - name: scale_and_integrate_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script:///work/ab0246/a270092/software/pycmor/examples/custom_steps.py:scale_by_constant
      - script:///work/ab0246/a270092/software/pycmor/examples/custom_steps.py:vertical_integrate
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # Heat transport (W) — utemp/vtemp × ρcp × hnode × edge_length
  - name: heat_transport_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script:///work/ab0246/a270092/software/pycmor/examples/custom_steps.py:compute_heat_transport
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  - name: fx_extract_pipeline
    steps:
      - script:///work/ab0246/a270092/software/pycmor/examples/custom_steps.py:load_gridfile
      - pycmor.std_lib.generic.get_variable
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

inherit:
  data_path: &dp /work/bb1469/a270092/runtime/awiesm3-develop/cmip7_output_017/outdata/fesom
  source_id: AWI-ESM3-VEG-LR
  institution_id: AWI
  experiment_id: piControl
  activity_id: CMIP
  parent_experiment_id: no parent
  variant_label: r1i1p1f1
  grid_label: gn
  mesh_path: &mp /work/ab0246/a270092/input/fesom2/core2
  grid_file: /work/ab0246/a270092/input/fesom2/core2/mesh.nc
  grid: "FESOM 2.6 unstructured grid CORE2 (126858 surface nodes)"
  nominal_resolution: "100 km"
  institution: "Alfred Wegener Institute, Helmholtz Centre for Polar and Marine Research, Bremerhaven, Germany"
  output_directory: ./cmorized_output/cap7_ocean_core2_test
  year_start: 1909
  year_end: 1909

rules:
  # ============================================================
  # Part 1: Daily tossq — square of sea surface temperature
  # ============================================================
  # Input: daily SST from FESOM (sst.fesom.*.nc, daily output)
  # Pipeline: square daily SST, timeavg is no-op at daily frequency

  - name: tossq_day
    inputs:
      - path: *dp
        pattern: sst.fesom.1909.nc
    compound_name: ocean.tossq.tavg-u-hxy-sea.day.GLB
    model_variable: sst
    squared_units: "degC2"
    pipelines:
      - square_pipeline

  # ============================================================
  # Part 2: Monthly volcello — time-varying ocean cell volume
  # ============================================================
  # Input: hnode (layer thickness) from FESOM, monthly averaged
  # Pipeline: compute volcello from hnode × cell_area

  - name: volcello_mon
    inputs:
      - path: *dp
        pattern: hnode.fesom.1909.nc
    compound_name: ocean.volcello.tavg-ol-hxy-sea.mon.GLB
    model_variable: hnode
    lazy_write: true
    pipelines:
      - volcello_time_pipeline

  # ============================================================
  # Part 3: Monthly friver — river water flux
  # ============================================================
  # Input: runoff from FESOM (newly enabled in namelist.io)
  # Units: m/s → kg m-2 s-1 (× 1000)

  - name: friver
    inputs:
      - path: *dp
        pattern: runoff.fesom.1909.nc
    compound_name: ocean.friver.tavg-u-hxy-sea.mon.GLB
    model_variable: runoff
    scale_factor: 1000.0
    scaled_units: "kg m-2 s-1"
    pipelines:
      - scale_pipeline

  # ============================================================
  # 3D ocean heat X transport (hfx) — requires ldiag_trflx=.true.
  # ============================================================

  # hfx — 3D ocean heat X transport (requires ldiag_trflx=.true.)
  # FESOM outputs utemp = u * T [m/s * degC]; scale by rho_0 * cp = 1025 * 3996 ≈ 4.096e6 → W m-2.
  - name: hfx
    inputs:
      - path: *dp
        pattern: utemp.fesom.1909.nc
    compound_name: ocean.hfx.tavg-ol-hxy-sea.mon.GLB
    model_variable: utemp
    scale_factor: 4095900.0
    scaled_units: "W"
    hnode_path: *dp
    hnode_pattern: hnode.fesom.1909.nc
    hnode_variable: hnode
    lazy_write: true
    pipelines:
      - heat_transport_pipeline

  # hfxint — column-integrated heat X transport (W); vertical_sum applied in step.
  - name: hfxint
    inputs:
      - path: *dp
        pattern: utemp.fesom.1909.nc
    compound_name: ocean.hfx.tavg-u-hxy-sea.mon.GLB
    model_variable: utemp
    scale_factor: 4095900.0
    scaled_units: "W"
    hnode_path: *dp
    hnode_pattern: hnode.fesom.1909.nc
    hnode_variable: hnode
    vertical_sum: true
    pipelines:
      - heat_transport_pipeline

  - name: hfy
    inputs:
      - path: *dp
        pattern: vtemp.fesom.1909.nc
    compound_name: ocean.hfy.tavg-ol-hxy-sea.mon.GLB
    model_variable: vtemp
    scale_factor: 4095900.0
    scaled_units: "W"
    hnode_path: *dp
    hnode_pattern: hnode.fesom.1909.nc
    hnode_variable: hnode
    lazy_write: true
    pipelines:
      - heat_transport_pipeline

  - name: hfyint
    inputs:
      - path: *dp
        pattern: vtemp.fesom.1909.nc
    compound_name: ocean.hfy.tavg-u-hxy-sea.mon.GLB
    model_variable: vtemp
    scale_factor: 4095900.0
    scaled_units: "W"
    hnode_path: *dp
    hnode_pattern: hnode.fesom.1909.nc
    hnode_variable: hnode
    vertical_sum: true
    pipelines:
      - heat_transport_pipeline

  # ============================================================
  # Part N: 3-hourly tauuo — surface X wind stress
  # ============================================================
  # Input: tx_sur from FESOM at 3-hourly output frequency.
  # Prerequisite: enable 3-hourly tx_sur output in namelist.io
  # (one output stream per variable, separate from the monthly stream).
  # The DefaultPipeline timeavg step is a no-op at 3hr target frequency;
  # the data should already be 3-hourly averages from FESOM.
  # NOTE: tx_sur is on the elem grid (6.2M elements); same elem→node
  # caveat as the monthly tauuo rule in core_ocean applies here.

  # Test with monthly data (3hr not available in CORE2 test output)
  - name: tauuo_mon
    inputs:
      - path: *dp
        pattern: tx_sur.fesom.1909.nc
    compound_name: ocean.tauuo.tavg-u-hxy-sea.mon.GLB
    model_variable: tx_sur

  - name: tauvo_mon
    inputs:
      - path: *dp
        pattern: ty_sur.fesom.1909.nc
    compound_name: ocean.tauvo.tavg-u-hxy-sea.mon.GLB
    model_variable: ty_sur

  # ============================================================
  # HARD: 3D salt transport (sfx, sfy)
  # ============================================================

  # sfx/sfy — 3D salt mass transport
  # Compute: velocity × salinity × cell cross-section
  # Requires: unod × salt + dz weighting; complex multi-field pipeline
  # TODO: implement compute_salt_transport step
  # - name: sfx
  #   inputs:
  #     - path: *dp
  #       pattern: unod.fesom.1909.nc
  #   compound_name: ocean.sfx.tavg-ol-hxy-sea.mon.GLB
  #   model_variable: unod

  # - name: sfy
  #   inputs:
  #     - path: *dp
  #       pattern: vnod.fesom.1909.nc
  #   compound_name: ocean.sfy.tavg-ol-hxy-sea.mon.GLB
  #   model_variable: vnod
