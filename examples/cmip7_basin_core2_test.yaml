# Basin mask pass-through test on CORE2 (LR) mesh.
# Produces ocean.basin Ofx from /work/ab0246/a270092/input/fesom2/core2/basin_mask.nc

general:
  name: "awiesm3-cmip7-basin-core2-test"
  cmor_version: "CMIP7"
  mip: "CMIP"
  CMIP7_DReq_metadata: "/home/a/a270092/.cache/pycmor/cmip7_metadata/v1.2.2.2/metadata.json"

pycmor:
  warn_on_no_rule: False
  parallel: False
  dask_cluster: "slurm"
  dask_cluster_scaling_mode: "fixed"
  dask_cluster_scaling_fixed_jobs: 1

jobqueue:
  slurm:
    name: pycmor-worker
    queue: compute
    account: ba0989
    cores: 16
    memory: 64GB
    walltime: '00:15:00'

pipelines:
  - name: basin_pipeline
    steps:
      - script:///work/ab0246/a270092/software/pycmor/examples/custom_steps.py:load_basin_mask
      - pycmor.std_lib.generic.get_variable
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  - name: msftmz_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - script:///work/ab0246/a270092/software/pycmor/examples/custom_steps.py:compute_msftmz
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  - name: hfbasin_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - script:///work/ab0246/a270092/software/pycmor/examples/custom_steps.py:compute_hfbasin
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  - name: sltbasin_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - script:///work/ab0246/a270092/software/pycmor/examples/custom_steps.py:compute_sltbasin
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

inherit:
  data_path: &dp /work/bb1469/a270092/runtime/awiesm3-develop/cmip7_output_013/outdata/fesom
  source_id: AWI-ESM-3
  institution_id: AWI
  experiment_id: picontrol
  variant_label: r1i1p1f1
  grid_label: gn
  mesh_path: &mp /work/ab0246/a270092/input/fesom2/core2
  grid_file: /work/ab0246/a270092/input/fesom2/core2/mesh.nc
  basin_mask_file: /work/ab0246/a270092/input/fesom2/core2/basin_mask.nc
  grid: "FESOM 2 unstructured grid CORE2 (126858 surface nodes)"
  nominal_resolution: "100 km"
  institution: "Alfred Wegener Institute, Helmholtz Centre for Polar and Marine Research, Bremerhaven, Germany"
  time_dimname: time
  output_directory: ./cmorized_output/basin_core2_test
  year_start: 1900
  year_end: 1900

rules:
  - name: basin
    inputs:
      - path: *mp
        pattern: basin_mask.nc
    compound_name: ocean.basin.ti-u-hxy-u.fx.GLB
    model_variable: basin
    pipelines:
      - basin_pipeline

  - name: msftmz
    inputs:
      - path: *dp
        pattern: w.fesom.1900.nc
    compound_name: ocean.msftm.tavg-ol-hyb-sea.mon.GLB
    model_variable: msftmz
    pipelines:
      - msftmz_pipeline

  - name: hfbasin
    inputs:
      - path: *dp
        pattern: vtemp.fesom.1900.nc
    compound_name: ocean.hfbasin.tavg-u-hyb-sea.mon.GLB
    model_variable: hfbasin
    pipelines:
      - hfbasin_pipeline

  - name: sltbasin
    inputs:
      - path: *dp
        pattern: vsalt.fesom.1900.nc
    compound_name: ocean.sltbasin.tavg-u-hyb-sea.mon.GLB
    model_variable: sltbasin
    pipelines:
      - sltbasin_pipeline
