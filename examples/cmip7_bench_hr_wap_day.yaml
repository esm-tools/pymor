# HR write-path benchmark: wap_day — representative 3D daily plev rule.
# In job 24405290 wap_day took 403 s (next-slowest after tasmax_mon's
# numba-compile outlier, which is now fixed by the numpy default engine).
#
# Input:  atm_remapped_1d_pl_cmip7_w_1d_pl_cmip7_1586-1586.nc  (~9.1 GB)
#         shape: (time=365, plev=19, lat=720, lon=1440) float32
# Output: same shape, regriddded metadata → expected ≈ 7–8 GB compressed
#
# Uses lazy_write: true (production default for heavy 3D rules) so
# trigger_compute is a no-op and all the work lands in save_dataset.

general:
  name: "hr-wap-day-bench"
  cmor_version: "CMIP7"
  mip: "CMIP"
  CMIP7_DReq_metadata: "/home/a/a270092/.cache/pycmor/cmip7_metadata/v1.2.2.2/metadata.json"

pycmor:
  warn_on_no_rule: False
  parallel: False
  dask_cluster: "local"
  dask_n_workers: 1

inherit:
  data_path: &dp /work/bb1469/a270092/runtime/awiesm3-develop/HR_test_01/outdata/oifs
  source_id: AWI-ESM-3
  institution_id: AWI
  experiment_id: picontrol
  variant_label: r1i1p1f1
  grid_label: gr
  grid: "OpenIFS TCo319 reduced Gaussian, interpolated to 0.25deg regular grid"
  nominal_resolution: "25 km"
  institution: "Alfred Wegener Institute, Helmholtz Centre for Polar and Marine Research, Bremerhaven, Germany"
  time_dimname: time_counter
  output_directory: ./cmorized_output/bench_hr_wap_day

rules:
  - name: wap_day
    inputs:
      - path: *dp
        pattern: atm_remapped_1d_pl_cmip7_w_1d_pl_cmip7_.*\.nc
    compound_name: atmos.wap.tavg-p19-hxy-u.day.GLB
    model_variable: w
    lazy_write: true
    # With the system (module-loaded) libnetcdf+HDF5 stack the zstd codec
    # is available and ~3-5x faster than zlib-1 at a similar ratio.
    netcdf_compression_codec: blosc_zstd
    netcdf_compression_level: 3
    # The system HDF5 1.14.2 build is thread-safe (verified with
    # H5is_library_threadsafe). Use the dask "threads" scheduler so
    # multiple chunks compress+write concurrently rather than in a
    # single-core stream.
    netcdf_write_scheduler: threads
