general:
  name: "awiesm3-cmip7"
  cmor_version: "CMIP7"
  mip: "CMIP"
  # Path to CMIP7 Data Request metadata
  CMIP7_DReq_metadata: "/path/to/CMIP7_DReq_Software/dreq_metadata.json"
  # Path to CMIP7 Controlled Vocabularies (optional - uses fallback chain)
  # CV_Dir: "/path/to/CMIP7-CVs"

pycmor:
  warn_on_no_rule: False
  use_flox: True

# Common attributes inherited by all rules (optional)
inherit:
  source_id: AWI-ESM-3
  institution_id: AWI
  variant_label: r1i1p1f1
  grid_label: gn

rules:
  # Example 1: Atmospheric variable (ECHAM)
  - name: tas
    inputs:
      - path: ./model_runs/historical/outdata/echam/
        pattern: temp2_echam_mon_.*nc

    # CMIP7 compound name format: realm.variable.cell_methods.frequency.grid
    compound_name: atmos.tas.tavg-h2m-hxy-u.mon.GLB

    # Model variable mapping
    model_variable: temp2

    # Experiment-specific attributes
    experiment_id: historical

    # Optional: Provide descriptive metadata
    grid: "Native atmosphere T63 grid (192x96)"
    nominal_resolution: "250 km"
    source: "AWI-ESM-3.0 (2025): atmosphere: ECHAM6.3, ocean: FESOM2.6"
    institution: "Alfred Wegener Institute, Helmholtz Centre for Polar and Marine Research, Bremerhaven, Germany"

    # Output
    output_directory: ./output/CMIP7

  # Example 2: Ocean variable (FESOM)
  - name: tos
    inputs:
      - path: ./model_runs/historical/outdata/fesom/
        pattern: sst_fesom_mon_.*nc

    compound_name: ocean.tos.tavg-u-hxy-u.mon.GLB

    model_variable: sst
    experiment_id: historical

    # Grid information for unstructured mesh
    grid_file: /pool/data/AWICM3/FESOM2/MESHES/PI/griddes.nc
    mesh_path: /pool/data/AWICM3/FESOM2/MESHES/PI
    grid: "FESOM 2.6 unstructured grid (PI mesh, ~25 km)"
    nominal_resolution: "25 km"

    output_directory: ./output/CMIP7

  # Example 3: Ocean biogeochemistry (REcoM)
  - name: fgco2
    inputs:
      - path: ./model_runs/piControl/outdata/recom/
        pattern: CO2f_fesom_mon_.*nc

    # Manual specification without compound name also works
    cmor_variable: fgco2
    frequency: mon
    realm: ocnBgchem
    table_id: Omon

    model_variable: CO2f
    experiment_id: piControl

    grid_file: /pool/data/AWICM3/FESOM2/MESHES/PI/griddes.nc
    mesh_path: /pool/data/AWICM3/FESOM2/MESHES/PI
    grid: "FESOM 2.6 unstructured grid with REcoM3 biogeochemistry"
    nominal_resolution: "25 km"

    output_directory: ./output/CMIP7

  # Example 4: Sea ice variable
  - name: siconc
    inputs:
      - path: ./model_runs/historical/outdata/fesom/
        pattern: a_ice_fesom_mon_.*nc

    compound_name: seaIce.siconc.tavg-u-hxy-u.mon.GLB

    model_variable: a_ice
    experiment_id: historical

    grid_file: /pool/data/AWICM3/FESOM2/MESHES/PI/griddes.nc
    mesh_path: /pool/data/AWICM3/FESOM2/MESHES/PI
    grid: "FESOM 2.6 unstructured grid (sea ice)"
    nominal_resolution: "25 km"

    output_directory: ./output/CMIP7

  # Example 5: 3D ocean variable with vertical levels
  - name: thetao
    inputs:
      - path: ./model_runs/piControl/outdata/fesom/
        pattern: thetao_fesom_mon_.*nc

    compound_name: ocean.thetao.mean.mon.gn

    model_variable: thetao
    experiment_id: piControl

    mesh_path: /pool/data/AWICM3/FESOM2/MESHES/PI
    grid: "FESOM 2.6 unstructured grid (46 vertical levels)"
    nominal_resolution: "25 km"

    output_directory: ./output/CMIP7

    # Use pipeline with vertical regridding if needed
    pipelines:
      - fesom_3d_pipeline
