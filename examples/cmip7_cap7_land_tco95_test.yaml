# CMIP7 CAP7 Land Variables — AWI-ESM3-VEG-HR
# Generated from cmip7_CAP7_variables_land.csv
#
# 98 total: 12 in core/lrcs/veg/extra, 54 new rules, 2 need new custom step,
# 30 blocked (per-PFT group, missing .out files, no depth-resolved cSoil).
# See cmip7_cap7_land_todo.md for full variable tracking.

general:
  name: "awiesm3-cmip7-cap7-land-tco95-test"
  cmor_version: "CMIP7"
  mip: "CMIP"
  CMIP7_DReq_metadata: "/home/a/a270092/.cache/pycmor/cmip7_metadata/v1.2.2.2/metadata.json"

pycmor:
  warn_on_no_rule: False
  parallel: False
  dask_cluster: "slurm"
  dask_cluster_scaling_mode: "fixed"
  dask_cluster_scaling_fixed_jobs: 1

jobqueue:
  slurm:
    name: pycmor-worker
    queue: compute
    account: ba0989
    cores: 16
    memory: 256GB
    walltime: '00:30:00'

pipelines:
  # LPJ-GUESS monthly loader (Lon/Lat/Year/Jan..Dec format)
  - name: lpjg_monthly_pipeline
    steps:
      - script:///work/ab0246/a270092/software/pycmor/examples/custom_steps.py:load_lpjguess_monthly
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

inherit:
  data_path: &dp /work/bb1469/a270092/runtime/awiesm3-develop/cmip7_output_013/outdata/oifs
  lpjg_data_path: &ldp /work/bb1469/a270092/runtime/awiesm3-develop/cmip7_output_013/outdata/lpj_guess
  source_id: AWI-ESM-3
  institution_id: AWI
  experiment_id: picontrol
  variant_label: r1i1p1f1
  grid_label: gn
  grid: "OpenIFS TCo95 reduced Gaussian, interpolated to 1deg regular grid"
  nominal_resolution: "100 km"
  institution: "Alfred Wegener Institute, Helmholtz Centre for Polar and Marine Research, Bremerhaven, Germany"
  time_dimname: time_counter
  output_directory: ./cmorized_output/cap7_land_tco95_test
  year_start: 1900
  year_end: 1900

rules:
  # ============================================================
  # Part 1: LPJ-GUESS monthly variables (49 rules)
  # ============================================================
  # All from plain-text .out files: Lon/Lat/Year/Jan..Dec
  # model_variable = "Total" (single-column monthly format)

  # --- Carbon pools (10) ---

  - name: cLand_mon
    inputs:
      - path: *ldp
        pattern: "*/run1/cLand_monthly.out"
    compound_name: land.cLand.tavg-u-hxy-lnd.mon.GLB
    model_variable: Total
    source_units: "kg m-2"
    pipelines:
      - lpjg_monthly_pipeline

  - name: cLeaf_mon
    inputs:
      - path: *ldp
        pattern: "*/run1/cLeaf_monthly.out"
