# CMIP7 VEG Sea Ice Variables — Test config with CORE2 mesh
# Adapted from awi-esm3-veg-hr-variables/veg_seaice/cmip7_awiesm3-veg-hr_seaice.yaml
# Uses low-resolution CORE2 (~100km) for quick testing.
# 1 rule: daily sisnhc derived from m_snow + a_ice

general:
  name: "awiesm3-cmip7-veg-seaice-core2-test"
  cmor_version: "CMIP7"
  mip: "CMIP"
  CMIP7_DReq_metadata: "/home/a/a270092/.cache/pycmor/cmip7_metadata/v1.2.2.4/metadata.json"

pycmor:
  enable_output_subdirs: true
  warn_on_no_rule: False
  parallel: False
  dask_cluster: "slurm"
  dask_n_workers: 1
  dask_cluster_scaling_mode: "fixed"
  dask_cluster_scaling_fixed_jobs: 1

jobqueue:
  slurm:
    name: pycmor-worker
    queue: compute
    account: ba0989
    cores: 16
    memory: 256GB
    walltime: '00:30:00'

pipelines:
  # Snow heat content from daily m_snow + a_ice
  # h_snow = m_snow / (rho_snow * a_ice), sisnhc = -rho_snow * L_f * h_snow
  - name: sisnhc_from_msnow_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:compute_sisnhc_from_msnow
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

      - pycmor.std_lib.qc.run_compliance_checker
inherit:
  # Write-perf defaults rolled out from HR atm core bench:
  netcdf_compression_codec: blosc_zstd
  netcdf_compression_level: 3
  netcdf_write_scheduler: threads
  data_path: &dp /work/bb1469/a270092/runtime/awiesm3-develop/LR_run_test3/outdata/fesom
  source_id: AWI-ESM3-VEG-LR
  institution_id: AWI
  experiment_id: piControl
  activity_id: CMIP
  parent_experiment_id: no parent
  variant_label: r1i1p1f1
  grid_label: gn
  mesh_path: /work/ab0246/a270092/input/fesom2/core2
  grid_file: /work/ab0246/a270092/input/fesom2/core2/mesh.nc
  grid: "FESOM 2.7 unstructured grid CORE2 (126858 surface nodes)"
  nominal_resolution: "100 km"
  institution: "Alfred Wegener Institute for Polar and Marine Research"
  output_directory: ./cmorized_output/veg_seaice_core2_test
  year_start: 1900
  year_end: 1901

rules:
  # Daily snow heat content: derived from daily m_snow and a_ice
  # sisnhc = -L_f * m_snow / a_ice (latent heat dominates, sensible ~ 0)
  - name: sisnhc_day
    inputs:
      - path: *dp
        pattern: m_snow\.fesom\..*\.nc
    compound_name: seaIce.sisnhc.tavg-u-hxy-si.day.glb
    model_variable: m_snow
    second_input_path: *dp
    second_input_pattern: a_ice\.fesom\..*\.nc
    second_variable: a_ice
    rho_snow: 330.0
    L_f: 334000.0
    pipelines:
      - sisnhc_from_msnow_pipeline
