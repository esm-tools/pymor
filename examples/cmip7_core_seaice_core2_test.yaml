# CMIP7 Core Sea Ice Variables — Test config with CORE2 mesh
# Adapted from awi-esm3-veg-hr-variables/core_seaice/cmip7_awiesm3-veg-hr_seaice.yaml
# Uses low-resolution CORE2 mesh (~100km) for quick testing.

general:
  name: "awiesm3-cmip7-core-seaice-core2-test"
  cmor_version: "CMIP7"
  mip: "CMIP"
  CMIP7_DReq_metadata: "/home/a/a270092/.cache/pycmor/cmip7_metadata/v1.2.2.2/metadata.json"

pycmor:
  enable_output_subdirs: true
  warn_on_no_rule: False
  parallel: False
  dask_cluster: "slurm"
  dask_n_workers: 1
  dask_cluster_scaling_mode: "fixed"
  dask_cluster_scaling_fixed_jobs: 1

jobqueue:
  slurm:
    name: pycmor-worker
    queue: compute
    account: ba0989
    cores: 16
    memory: 256GB
    walltime: '00:30:00'

pipelines:
  # siconc: fraction (0-1) → percentage (0-100)
  - name: siconc_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:fraction_to_percent
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset
      - pycmor.std_lib.qc.run_compliance_checker

  # sitimefrac: binary ice presence from siconc > 0
  - name: sitimefrac_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:compute_sitimefrac
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # simass: m_ice is thickness (m), CMIP wants mass per area (kg m-2) → multiply by rho_ice
  - name: scale_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:scale_by_constant
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

inherit:
  # Write-perf defaults rolled out from HR atm core bench:
  netcdf_compression_codec: blosc_zstd
  netcdf_compression_level: 3
  netcdf_write_scheduler: threads
  data_path: &dp /work/bb1469/a270092/runtime/awiesm3-develop/LR_run_test3/outdata/fesom
  source_id: AWI-ESM3-VEG-LR
  institution_id: AWI
  experiment_id: piControl
  activity_id: CMIP
  parent_experiment_id: no parent
  variant_label: r1i1p1f1
  grid_label: gn
  mesh_path: &mp /work/ab0246/a270092/input/fesom2/core2
  grid_file: /work/ab0246/a270092/input/fesom2/core2/mesh.nc
  grid: "FESOM 2.6 unstructured grid CORE2 (126858 surface nodes)"
  nominal_resolution: "100 km"
  institution: "Alfred Wegener Institute for Polar and Marine Research"
  output_directory: ./cmorized_output/core_seaice_core2_test
  year_start: 1900
  year_end: 1901
  # Per-shard QC (fires after save_dataset for pipelines that include
  # pycmor.std_lib.qc.run_compliance_checker — currently siconc_pipeline only).
  qc_enabled: true
  qc_tests:
    - cf
    - wcrp_cmip7
  qc_criteria: normal
  qc_fail_on_mandatory: false

rules:
  # ============================================================
  # Monthly (SImon) — DefaultPipeline
  # ============================================================

  - name: simass
    inputs:
      - path: *dp
        pattern: m_ice\.fesom\..*\.nc
    compound_name: seaIce.simass.tavg-u-hxy-si.mon.GLB
    model_variable: m_ice
    scale_factor: 917.0
    scaled_units: "kg m-2"
    pipelines:
      - scale_pipeline

  - name: siu
    inputs:
      - path: *dp
        pattern: uice\.fesom\..*\.nc
    compound_name: seaIce.siu.tavg-u-hxy-si.mon.GLB
    model_variable: uice

  - name: siv
    inputs:
      - path: *dp
        pattern: vice\.fesom\..*\.nc
    compound_name: seaIce.siv.tavg-u-hxy-si.mon.GLB
    model_variable: vice

  # ============================================================
  # Monthly (SImon) — h_ice, h_snow, ist
  # ============================================================

  - name: sithick
    inputs:
      - path: *dp
        pattern: h_ice\.fesom\..*\.nc
    compound_name: seaIce.sithick.tavg-u-hxy-si.mon.GLB
    model_variable: h_ice

  - name: snd
    inputs:
      - path: *dp
        pattern: h_snow\.fesom\..*\.nc
    compound_name: seaIce.snd.tavg-u-hxy-sn.mon.GLB
    model_variable: h_snow

  - name: ts
    inputs:
      - path: *dp
        pattern: ist\.fesom\..*\.nc
    compound_name: seaIce.ts.tavg-u-hxy-si.mon.GLB
    model_variable: ist

  # ============================================================
  # Monthly (SImon) — custom pipelines
  # ============================================================

  - name: siconc
    inputs:
      - path: *dp
        pattern: a_ice\.fesom\..*\.nc
    compound_name: seaIce.siconc.tavg-u-hxy-u.mon.GLB
    model_variable: a_ice
    pipelines:
      - siconc_pipeline

  - name: sitimefrac
    inputs:
      - path: *dp
        pattern: a_ice\.fesom\..*\.nc
    compound_name: seaIce.sitimefrac.tavg-u-hxy-sea.mon.GLB
    model_variable: a_ice
    pipelines:
      - sitimefrac_pipeline

  # ============================================================
  # Daily (SIday)
  # ============================================================

  - name: siconc_day
    inputs:
      - path: *dp
        pattern: a_ice\.fesom\..*\.nc
    compound_name: seaIce.siconc.tavg-u-hxy-u.day.GLB
    model_variable: a_ice
    pipelines:
      - siconc_pipeline
