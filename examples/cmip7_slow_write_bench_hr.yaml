# Minimal HR benchmark: isolates tasmax_mon (longest real pipeline at 632s
# in job 24405290 despite a ~20 MB output file).
#
# Input: atmos_day_minmax_tasmax_day_minmax_1586-1586.nc (329 MB)
#   shape: (time=365, cell=421120) float32
# Output: (time=12, cell=421120) float32 ≈ 20 MB
#
# Used to investigate why save_dataset / final write throughput is ~20 MB/s
# on a dedicated compute node.

general:
  name: "hr-slow-write-bench"
  cmor_version: "CMIP7"
  mip: "CMIP"
  CMIP7_DReq_metadata: "/home/a/a270092/.cache/pycmor/cmip7_metadata/v1.2.2.2/metadata.json"

pycmor:
  warn_on_no_rule: False
  parallel: False
  dask_cluster: "local"
  dask_n_workers: 4

inherit:
  data_path: &dp /work/bb1469/a270092/runtime/awiesm3-develop/HR_test_01/outdata/oifs
  source_id: AWI-ESM-3
  institution_id: AWI
  experiment_id: picontrol
  variant_label: r1i1p1f1
  grid_label: gn
  grid: "OpenIFS TCo319 reduced Gaussian"
  nominal_resolution: "25 km"
  institution: "Alfred Wegener Institute, Helmholtz Centre for Polar and Marine Research, Bremerhaven, Germany"
  time_dimname: time_counter
  output_directory: ./cmorized_output/slow_write_bench

rules:
  - name: tasmax_mon
    inputs:
      - path: *dp
        pattern: atmos_day_minmax_tasmax_day_minmax_.*\.nc
    compound_name: atmos.tas.tmaxavg-h2m-hxy-u.mon.GLB
    model_variable: tasmax
