# CMIP7 CAP7 Sea Ice Variables — AWI-ESM3-VEG-HR
# Generated from cmip7_CAP7_variables_seaIce.csv + seaIce_ocean.csv
#
# 21 total: 9 in core/lrcs/veg, 9 new rules, 3 blocked.
# Requires namelist.io changes: h_ice/h_snow→daily, prec/snow uncommented.
# See cmip7_cap7_seaice_todo.md for full variable tracking.

general:
  name: "awiesm3-cmip7-cap7-seaice"
  cmor_version: "CMIP7"
  mip: "CMIP"
  CMIP7_DReq_metadata: "/home/a/a270092/.cache/pycmor/cmip7_metadata/v1.2.2.3/metadata.json"

pycmor:
  warn_on_no_rule: False
  parallel: False
  dask_cluster: "slurm"
  dask_n_workers: 1
  dask_cluster_scaling_mode: "fixed"
  dask_cluster_scaling_fixed_jobs: 1

jobqueue:
  slurm:
    name: pycmor-worker
    queue: compute
    account: bb1469
    cores: 16
    memory: 256GB
    walltime: '00:30:00'

pipelines:
  # Scale by constant (m/s → kg m-2 s-1 via ×1000)
  - name: scale_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:scale_by_constant
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # Scale by constant + mask where no sea ice. Required for any compound
  # branded ``hxy-si`` whose CMIP7 cell_methods is
  # ``area: time: mean where sea_ice (mask=siconc)``. Rule must supply
  # aice_path / aice_pattern.
  - name: scale_mask_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:scale_by_constant
      - script://$PYCMOR_HOME/examples/custom_steps.py:mask_where_no_seaice
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

inherit:
  # Tier-wide throttle: prevent the HDF5-write-lock parallel-save wedge
  # observed across FESOM-ingesting tiers (cli40/43/45). Cap=1 via
  # PYCMOR_THROTTLE_CAPS forces strict serial. Wall-time penalty is ~5-15%
  # in the contended case, essentially zero when lock contention dominates
  # already.
  throttle_group: cap7_seaice_serial
  # Write-perf defaults rolled out from HR atm core bench:
  netcdf_compression_codec: blosc_zstd
  netcdf_compression_level: 3
  netcdf_write_scheduler: synchronous
  data_path: &dp /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/fesom
  source_id: AWI-ESM-3
  institution_id: AWI
  experiment_id: picontrol
  variant_label: r1i1p1f1
  grid_label: gn
  mesh_path: /work/ab0246/a270092/input/fesom2/dars2
  grid_file: /work/ab0246/a270092/input/fesom2/dars2/mesh.nc
  grid: "FESOM 2.6 unstructured grid DARS (3146761 surface nodes)"
  nominal_resolution: "10 km"
  institution: "Alfred Wegener Institute, Helmholtz Centre for Polar and Marine Research, Bremerhaven, Germany"
  output_directory: ./cmorized_output/awiesm3

rules:
  # ============================================================
  # Part 1: Daily — direct passthrough from FESOM
  # ============================================================

  - name: sithick_day
    inputs:
      - path: *dp
        pattern: h_ice\.fesom\.\d{4}\.nc
    compound_name: seaIce.sithick.tavg-u-hxy-si.day.glb
    model_variable: h_ice

  - name: snd_day
    inputs:
      - path: *dp
        pattern: h_snow\.fesom\.\d{4}\.nc
    compound_name: seaIce.snd.tavg-u-hxy-sn.day.glb
    model_variable: h_snow

  - name: siu_day
    inputs:
      - path: *dp
        pattern: uice\.fesom\.\d{4}\.nc
    compound_name: seaIce.siu.tavg-u-hxy-si.day.glb
    model_variable: uice
    # vec_autorotate=.true. set in namelist.io

  - name: siv_day
    inputs:
      - path: *dp
        pattern: vice\.fesom\.\d{4}\.nc
    compound_name: seaIce.siv.tavg-u-hxy-si.day.glb
    model_variable: vice
    # vec_autorotate=.true. set in namelist.io

  # ============================================================
  # Part 2: Monthly — direct passthrough or time-averaged
  # ============================================================

  # sieqthick = m_ice (effective ice thickness = volume per area)
  - name: sieqthick
    inputs:
      - path: *dp
        pattern: m_ice\.fesom\.\d{4}\.nc
    compound_name: seaIce.sieqthick.tavg-u-hxy-si.mon.glb
    model_variable: m_ice

  # snw = m_snow (snow mass per area); m → kg m-2 via ×1000 (water density).
  # hxy-si: mask where no sea ice (CMIP7 cell_methods says so).
  - name: snw
    inputs:
      - path: *dp
        pattern: m_snow\.fesom\.\d{4}\.nc
    compound_name: seaIce.snw.tavg-u-hxy-si.mon.glb
    model_variable: m_snow
    scale_factor: 1000.0
    scaled_units: "kg m-2"
    aice_path: *dp
    aice_pattern: a_ice\.fesom\.\d{4}\.nc
    pipelines:
      - scale_mask_pipeline

  # ============================================================
  # Part 3: Monthly — precipitation/evaporation (need ×1000 scaling)
  # ============================================================
  # FESOM outputs in m/s, CMOR needs kg m-2 s-1 (× rho_water = 1000).
  # All three (evspsbl, prra, prsn) are hxy-si branding with CMIP7
  # cell_methods ``area: time: mean where sea_ice (mask=siconc)`` —
  # mask the FESOM-grid scaled field to NaN where a_ice == 0 so the
  # written field only contains values over sea-ice-covered nodes.

  - name: evspsbl
    inputs:
      - path: *dp
        pattern: evap\.fesom\.\d{4}\.nc
    compound_name: seaIce.evspsbl.tavg-u-hxy-si.mon.glb
    model_variable: evap
    scale_factor: -1000.0  # FESOM evap is negative-up; CMIP7 evspsbl positive=upward
    scaled_units: "kg m-2 s-1"
    aice_path: *dp
    aice_pattern: a_ice\.fesom\.\d{4}\.nc
    pipelines:
      - scale_mask_pipeline

  - name: prra
    inputs:
      - path: *dp
        pattern: prec\.fesom\.\d{4}\.nc
    compound_name: seaIce.prra.tavg-u-hxy-si.mon.glb
    model_variable: prec
    scale_factor: 1000.0
    scaled_units: "kg m-2 s-1"
    aice_path: *dp
    aice_pattern: a_ice\.fesom\.\d{4}\.nc
    pipelines:
      - scale_mask_pipeline

  - name: prsn
    inputs:
      - path: *dp
        pattern: snow\.fesom\.\d{4}\.nc
    compound_name: seaIce.prsn.tavg-u-hxy-si.mon.glb
    model_variable: snow
    scale_factor: 1000.0
    scaled_units: "kg m-2 s-1"
    aice_path: *dp
    aice_pattern: a_ice\.fesom\.\d{4}\.nc
    pipelines:
      - scale_mask_pipeline
