inherit:
  # Write-perf defaults rolled out from HR atm core bench:
  netcdf_compression_codec: blosc_zstd
  netcdf_compression_level: 3
  netcdf_write_scheduler: threads
  data_path: &dp /work/bb1469/a270092/runtime/awiesm3-develop/HR_test_01/outdata/fesom
  source_id: AWI-ESM-3
  institution_id: AWI
  experiment_id: picontrol
  variant_label: r1i1p1f1
  grid_label: gn
  mesh_path: &mp /work/ab0246/a270092/input/fesom2/dars2
  grid_file: /work/ab0246/a270092/input/fesom2/dars2/mesh.nc
  grid: "FESOM 2.6 unstructured grid DARS (3146761 surface nodes)"
  nominal_resolution: "10 km"
  institution: "Alfred Wegener Institute, Helmholtz Centre for Polar and Marine Research, Bremerhaven, Germany"
  output_directory: ./cmorized_output/awiesm3

rules:
  # ============================================================
  # EASY: Direct mapping from ldiag_cmor or existing namelist.io
  # ============================================================

  # pbo — sea water pressure at sea floor (from ldiag_cmor=.true.)
  - name: pbo
    inputs:
      - path: *dp
        pattern: pbo\.fesom\..*\.nc
    compound_name: ocean.pbo.tavg-u-hxy-sea.mon.GLB
    model_variable: pbo

  # volo — sea water volume (from ldiag_cmor=.true., global scalar)
  - name: volo
    inputs:
      - path: *dp
        pattern: volo\.fesom\..*\.nc
    compound_name: ocean.volo.tavg-u-hm-sea.mon.GLB
    model_variable: volo

  # tos_ga — global average sea surface temperature (thetaoga from ldiag_cmor)
  - name: tos_ga
    inputs:
      - path: *dp
        pattern: thetaoga\.fesom\..*\.nc
    compound_name: ocean.tos.tavg-u-hm-sea.mon.GLB
    model_variable: thetaoga

  # sos_ga — global average sea surface salinity (soga from ldiag_cmor)
  - name: sos_ga
    inputs:
      - path: *dp
        pattern: soga\.fesom\..*\.nc
    compound_name: ocean.sos.tavg-u-hm-sea.mon.GLB
    model_variable: soga

  # thetao_ga — global average potential temperature (per level, from ldiag_cmor)
  # NOTE: ldiag_cmor outputs thetaoga as a scalar, not per-level.
  # The per-level profile requires a volume-weighted average pipeline.
  # Using the scalar version for now.
  - name: thetao_ga
    inputs:
      - path: *dp
        pattern: thetaoga\.fesom\..*\.nc
    compound_name: ocean.thetao.tavg-ol-hm-sea.mon.GLB
    model_variable: thetaoga

  # so_ga — global mean salinity (scalar from ldiag_cmor)
  - name: so_ga
    inputs:
      - path: *dp
        pattern: soga\.fesom\..*\.nc
    compound_name: ocean.so.tavg-ol-hm-sea.mon.GLB
    model_variable: soga

  # obvfsq — Brunt-Vaisala frequency squared (N2 from namelist.io)
  - name: obvfsq
    inputs:
      - path: *dp
        pattern: N2\.fesom\..*\.nc
    compound_name: ocean.obvfsq.tavg-ol-hxy-sea.mon.GLB
    model_variable: N2
    lazy_write: true

  # wfo — water flux into sea water (fw × rho_water)
  - name: wfo
    inputs:
      - path: *dp
        pattern: fw\.fesom\..*\.nc
    compound_name: ocean.wfo.tavg-u-hxy-sea.mon.GLB
    model_variable: fw
    scale_factor: 1000.0
    scaled_units: "kg m-2 s-1"
    pipelines:
      - scale_pipeline

  # vsf — virtual salt flux into sea water (virtsalt from namelist.io)
  - name: vsf
    inputs:
      - path: *dp
        pattern: virtsalt\.fesom\..*\.nc
    compound_name: ocean.vsf.tavg-u-hxy-sea.mon.GLB
    model_variable: virtsalt
    model_unit: "kg m-2 s-1"

  # ============================================================
  # Evaporation and salt flux correction
  # ============================================================

  # evspsbl — evaporation over ice-free ocean (evap × rho_water)
  - name: evspsbl
    inputs:
      - path: *dp
        pattern: evap\.fesom\..*\.nc
    compound_name: ocean.evspsbl.tavg-u-hxy-ifs.mon.GLB
    model_variable: evap
    scale_factor: -1000.0  # FESOM evap is negative-up; CMIP7 evspsbl positive=upward
    scaled_units: "kg m-2 s-1"
    pipelines:
      - scale_pipeline
    # NOTE: FESOM evap is total evaporation, not ice-free-only.
    # May need masking by (1 - siconc) if CMIP requires ice-free fraction only.

  # vsfcorr — virtual salt flux correction (relaxsalt)
  - name: vsfcorr
    inputs:
      - path: *dp
        pattern: relaxsalt\.fesom\..*\.nc
    compound_name: ocean.vsfcorr.tavg-u-hxy-sea.mon.GLB
    model_variable: relaxsalt
    model_unit: "kg m-2 s-1"

  # ============================================================
  # Daily fields
  # ============================================================

  - name: mlotst_day
    inputs:
      - path: *dp
        pattern: MLD3\.fesom\..*\.nc
    compound_name: ocean.mlotst.tavg-u-hxy-sea.day.GLB
    model_variable: MLD3
    scale_factor: -1.0  # FESOM MLD3 is negative depth; CMIP7 mlotst is positive-down
    scaled_units: "m"
    pipelines:
      - scale_pipeline

  - name: uos
    inputs:
      - path: *dp
        pattern: unod\.fesom\..*\.nc
    compound_name: ocean.uos.tavg-u-hxy-sea.day.GLB
    model_variable: unod
    lazy_write: true
    pipelines:
      - surface_extract_pipeline

  - name: vos
    inputs:
      - path: *dp
        pattern: vnod\.fesom\..*\.nc
    compound_name: ocean.vos.tavg-u-hxy-sea.day.GLB
    model_variable: vnod
    lazy_write: true
    pipelines:
      - surface_extract_pipeline

  # hfx_int_day — daily vertically integrated ocean heat X transport
  # Same approach as monthly hfxint in cap7_ocean: utemp × rho_0*cp then integrate over depth.
  # Requires: ldiag_trflx=.true. and utemp at daily frequency in namelist.io
  # (single stream shared with monthly hfx/hfxint rules; pycmor timeavgs daily → monthly).
  # WARNING: full 3D daily utemp on DARS (3.1M nodes × 47 levels) is very large.
  - name: hfx_int_day
    inputs:
      - path: *dp
        pattern: utemp\.fesom\..*\.nc
    compound_name: ocean.hfx.tavg-u-hxy-sea.day.GLB
    model_variable: utemp
    scale_factor: 4095900.0
    scaled_units: "W m-2"
    lazy_write: true
    pipelines:
      - scale_and_integrate_pipeline

  # hfy_int_day — daily vertically integrated ocean heat Y transport
  # Same approach as monthly hfyint: vtemp × rho_0*cp then integrate over depth.
  # Requires: ldiag_trflx=.true. and vtemp at daily frequency in namelist.io.
  - name: hfy_int_day
    inputs:
      - path: *dp
        pattern: vtemp\.fesom\..*\.nc
    compound_name: ocean.hfy.tavg-u-hxy-sea.day.GLB
    model_variable: vtemp
    scale_factor: 4095900.0
    scaled_units: "W m-2"
    lazy_write: true
    pipelines:
      - scale_and_integrate_pipeline

  # ============================================================
  # EASY: Squaring steps (tossq, sossq, zossq, mlotstsq)
  # ============================================================

  - name: tossq
    inputs:
      - path: *dp
        pattern: sst\.fesom\..*\.nc
    compound_name: ocean.tossq.tavg-u-hxy-sea.mon.GLB
    model_variable: sst
    squared_units: "degC2"
    pipelines:
      - square_pipeline

  - name: sossq
    inputs:
      - path: *dp
        pattern: sss\.fesom\..*\.nc
    compound_name: ocean.sossq.tavg-u-hxy-sea.mon.GLB
    model_variable: sss
    squared_units: "1E-06"
    pipelines:
      - square_pipeline

  - name: zossq
    inputs:
      - path: *dp
        pattern: ssh\.fesom\..*\.nc
    compound_name: ocean.zossq.tavg-u-hxy-sea.mon.GLB
    model_variable: ssh
    squared_units: "m2"
    pipelines:
      - square_pipeline

  - name: mlotstsq
    inputs:
      - path: *dp
        pattern: MLD3\.fesom\..*\.nc
    compound_name: ocean.mlotstsq.tavg-u-hxy-sea.mon.GLB
    model_variable: MLD3
    squared_units: "m2"
    pipelines:
      - square_pipeline

  # ============================================================
  # MEDIUM: Bottom extraction (tob, sob)
  # ============================================================

  - name: tob
    inputs:
      - path: *dp
        pattern: temp\.fesom\..*\.nc
    compound_name: ocean.tob.tavg-u-hxy-sea.mon.GLB
    model_variable: temp
    lazy_write: true
    pipelines:
      - bottom_extract_pipeline

  - name: sob
    inputs:
      - path: *dp
        pattern: salt\.fesom\..*\.nc
    compound_name: ocean.sob.tavg-u-hxy-sea.mon.GLB
    model_variable: salt
    lazy_write: true
    pipelines:
      - bottom_extract_pipeline

  # ============================================================
  # MEDIUM: Computed from existing output
  # ============================================================

  # pso — surface pressure from SSH
  - name: pso
    inputs:
      - path: *dp
        pattern: ssh\.fesom\..*\.nc
    compound_name: ocean.pso.tavg-u-hxy-sea.mon.GLB
    model_variable: ssh
    reference_density: 1025.0
    pipelines:
      - surface_pressure_pipeline

  # masso — global sea water mass (rho_0 × volo)
  # Approximation: masso = rho_0 × volo (Boussinesq)
  - name: masso
    inputs:
      - path: *dp
        pattern: volo\.fesom\..*\.nc
    compound_name: ocean.masso.tavg-u-hm-sea.mon.GLB
    model_variable: volo
    scale_factor: 1025.0
    scaled_units: "kg"
    pipelines:
      - scale_pipeline

  # phcint — integrated ocean heat content from potential temperature
  # integral of rho_0 * cp * temp over depth
  # Using vertical_integration_pipeline with scale: rho_0*cp = 1025*3992 ≈ 4.09e6
  # NOTE: The vertical_integrate step integrates data*dz; we need rho_0*cp*temp*dz.
  # We use scale_pipeline first to get rho_0*cp*temp, then integrate.
  # For now, use the integration pipeline and set scale in integration_attrs.
  - name: phcint
    inputs:
      - path: *dp
        pattern: temp\.fesom\..*\.nc
    compound_name: ocean.phcint.tavg-op4-hxy-sea.mon.GLB
    model_variable: temp
    lazy_write: true
    integration_attrs:
      long_name: "Depth integrated ocean heat content from potential temperature"
      standard_name: "integral_wrt_depth_of_product_of_sea_water_density_and_potential_temperature"
      units: "J m-2"
    pipelines:
      - ocean_vertical_integration_pipeline
    # NOTE: needs post-multiply by rho_0*cp — may need a combined pipeline

  # scint — depth-integrated practical salinity as salt mass content
  # Similar to absscint (already in core_ocean)
  - name: scint
    inputs:
      - path: *dp
        pattern: salt\.fesom\..*\.nc
    compound_name: ocean.scint.tavg-op4-hxy-sea.mon.GLB
    model_variable: salt
    lazy_write: true
    integration_attrs:
      long_name: "Integral wrt depth of seawater practical salinity expressed as salt mass content"
      standard_name: "integral_wrt_depth_of_sea_water_practical_salinity_expressed_as_salt_mass_content"
      units: "kg m-2"
    pipelines:
      - ocean_vertical_integration_pipeline

  # opottempmint — depth integral of rho_0 × potential temperature (Oyr)
  # integral(rho_0 * temp * dz) — uses vertical integration with rho_0 scaling
  - name: opottempmint
    inputs:
      - path: *dp
        pattern: temp\.fesom\..*\.nc
    compound_name: ocean.opottempmint.tavg-u-hxy-sea.yr.GLB
    model_variable: temp
    lazy_write: true
    integration_attrs:
      long_name: "Depth integral of product of sea water density and potential temperature"
      standard_name: "integral_wrt_depth_of_product_of_sea_water_density_and_potential_temperature"
      units: "degC kg m-2"
    pipelines:
      - ocean_vertical_integration_pipeline
    # NOTE: needs post-multiply by rho_0 — may need combined pipeline

  # somint — depth integral of rho_0 × salinity (Oyr)
  # integral(rho_0 * salt * dz)
  - name: somint
    inputs:
      - path: *dp
        pattern: salt\.fesom\..*\.nc
    compound_name: ocean.somint.tavg-u-hxy-sea.yr.GLB
    model_variable: salt
    lazy_write: true
    integration_attrs:
      long_name: "Integral wrt depth of product of sea water density and salinity"
      standard_name: "integral_wrt_depth_of_product_of_sea_water_density_and_salinity"
      units: "g m-2"
    pipelines:
      - ocean_vertical_integration_pipeline
    # NOTE: needs post-multiply by rho_0*1000 — may need combined pipeline

  # volcello (fx) — static ocean grid-cell volume
  # cell_area × layer_thickness from mesh
  - name: volcello_fx
    inputs:
      - path: *mp
        pattern: mesh.nc
    compound_name: ocean.volcello.ti-ol-hxy-sea.fx.GLB
    model_variable: volcello
    lazy_write: true
    pipelines:
      - volcello_fx_pipeline

  # ============================================================
  # MEDIUM: Yearly mixing/diffusivity (Oyr)
  # ============================================================

  # difvho — vertical heat diffusivity (Kv from namelist.io)
  # FESOM uses same Kv for heat and salt
  - name: difvho
    inputs:
      - path: *dp
        pattern: Kv\.fesom\..*\.nc
    compound_name: ocean.difvho.tavg-ol-hxy-sea.yr.GLB
    model_variable: Kv
    lazy_write: true
    # NOTE: monthly data, CMIP wants yearly average — needs yearly timeavg

  # difvso — vertical salt diffusivity (same Kv)
  - name: difvso
    inputs:
      - path: *dp
        pattern: Kv\.fesom\..*\.nc
    compound_name: ocean.difvso.tavg-ol-hxy-sea.yr.GLB
    model_variable: Kv
    lazy_write: true

  # difmxylo — momentum XY Laplacian diffusivity (Av from namelist.io)
  - name: difmxylo
    inputs:
      - path: *dp
        pattern: Av\.fesom\..*\.nc
    compound_name: ocean.difmxylo.tavg-ol-hxy-sea.yr.GLB
    model_variable: Av
    lazy_write: true

  # ============================================================
  # DECADAL: 10-year averages of existing variables
  # These use DefaultPipeline with modified time averaging.
  # Need multi-year input patterns (e.g. temp.fesom.*.nc)
  # ============================================================

  - name: thetao_dec
    inputs:
      - path: *dp
        pattern: temp\.fesom\..*\.nc
    compound_name: ocean.thetao.tavg-ol-hxy-sea.dec.GLB
    model_variable: temp
    lazy_write: true
    # TODO: needs 10-year input pattern and decadal timeavg

  - name: so_dec
    inputs:
      - path: *dp
        pattern: salt\.fesom\..*\.nc
    compound_name: ocean.so.tavg-ol-hxy-sea.dec.GLB
    model_variable: salt
    lazy_write: true

  - name: tauuo_dec
    inputs:
      - path: *dp
        pattern: tx_sur\.fesom\..*\.nc
    compound_name: ocean.tauuo.tavg-u-hxy-sea.dec.GLB
    model_variable: tx_sur

  - name: tauvo_dec
    inputs:
      - path: *dp
        pattern: ty_sur\.fesom\..*\.nc
    compound_name: ocean.tauvo.tavg-u-hxy-sea.dec.GLB
    model_variable: ty_sur

  - name: thkcello_dec
    inputs:
      - path: *dp
        pattern: hnode\.fesom\..*\.nc
    compound_name: ocean.thkcello.tavg-ol-hxy-sea.dec.GLB
    model_variable: hnode
    lazy_write: true

  - name: volo_dec
    inputs:
      - path: *dp
        pattern: volo\.fesom\..*\.nc
    compound_name: ocean.volo.tavg-u-hm-sea.dec.GLB
    model_variable: volo

  - name: masscello_dec
    inputs:
      - path: *dp
        pattern: hnode\.fesom\..*\.nc
    compound_name: ocean.masscello.tavg-ol-hxy-sea.dec.GLB
    model_variable: hnode
    scale_factor: 1025.0
    scaled_units: "kg m-2"
    lazy_write: true
    pipelines:
      - scale_pipeline

  - name: volcello_dec
    inputs:
      - path: *dp
        pattern: hnode\.fesom\..*\.nc
    compound_name: ocean.volcello.tavg-ol-hxy-sea.dec.GLB
    model_variable: hnode
    lazy_write: true
    pipelines:
      - volcello_time_pipeline

  - name: masso_dec
    inputs:
      - path: *dp
        pattern: volo\.fesom\..*\.nc
    compound_name: ocean.masso.tavg-u-hm-sea.dec.GLB
    model_variable: volo
    scale_factor: 1025.0
    scaled_units: "kg"
    pipelines:
      - scale_pipeline

  # ============================================================
  # Barotropic streamfunction
  # ============================================================

  # msftbarot — barotropic mass streamfunction
  # Geostrophic SSH approximation: psi = rho_0 * g * H / f * eta
  # where H is local ocean depth (from mesh) and f is the Coriolis parameter.
  # NaN is set in the equatorial band where |f| < f_min (~|lat| < 4 deg).
  - name: msftbarot
    inputs:
      - path: *dp
        pattern: ssh\.fesom\..*\.nc
    compound_name: ocean.msftbarot.tavg-u-hxy-sea.mon.GLB
    model_variable: ssh
    pipelines:
      - msftbarot_pipeline

  # ============================================================
  # HARD: Temperature tendency (opottemptend from ldiag_cmor)
  # ============================================================

  # opottemptend — tendency of potential temperature as heat content
  # Available from ldiag_cmor=.true. (already enabled)
  - name: opottemptend
    inputs:
      - path: *dp
        pattern: opottemptend\.fesom\..*\.nc
    compound_name: ocean.opottemptend.tavg-ol-hxy-sea.yr.GLB
    model_variable: opottemptend
    lazy_write: true
    # NOTE: monthly data, CMIP wants yearly — needs yearly timeavg

  # ============================================================
  # NEW FESOM2 DIAGNOSTICS (require source code changes)
  # These variables were added to gen_modules_cmor_diag.F90
  # ============================================================

  # osalttend — total salinity tendency (column-integrated)
  - name: osalttend
    inputs:
      - path: *dp
        pattern: osalttend\.fesom\..*\.nc
    compound_name: ocean.osalttend.tavg-ol-hxy-sea.yr.GLB
    model_variable: osalttend
    model_unit: "kg m-2 s-1"
    lazy_write: true

  # opottemprmadvect — temperature tendency from residual mean advection
  - name: opottemprmadvect
    inputs:
      - path: *dp
        pattern: opottemprmadvect\.fesom\..*\.nc
    compound_name: ocean.opottemprmadvect.tavg-ol-hxy-sea.yr.GLB
    model_variable: opottemprmadvect
    lazy_write: true

  # opottempdiff — temperature tendency from dianeutral mixing
  - name: opottempdiff
    inputs:
      - path: *dp
        pattern: opottempdiff\.fesom\..*\.nc
    compound_name: ocean.opottempdiff.tavg-ol-hxy-sea.yr.GLB
    model_variable: opottempdiff
    lazy_write: true

  # osaltrmadvect — salinity tendency from residual mean advection
  - name: osaltrmadvect
    inputs:
      - path: *dp
        pattern: osaltrmadvect\.fesom\..*\.nc
    compound_name: ocean.osaltrmadvect.tavg-ol-hxy-sea.yr.GLB
    model_variable: osaltrmadvect
    model_unit: "kg m-2 s-1"
    lazy_write: true

  # osaltdiff — salinity tendency from dianeutral mixing
  - name: osaltdiff
    inputs:
      - path: *dp
        pattern: osaltdiff\.fesom\..*\.nc
    compound_name: ocean.osaltdiff.tavg-ol-hxy-sea.yr.GLB
    model_variable: osaltdiff
    model_unit: "kg m-2 s-1"
    lazy_write: true

  # rsdoabsorb — net rate of absorption of shortwave energy in ocean layer (3D)
  - name: rsdoabsorb
    inputs:
      - path: *dp
        pattern: rsdoabsorb\.fesom\..*\.nc
    compound_name: ocean.rsdoabsorb.tavg-ol-hxy-sea.yr.GLB
    model_variable: rsdoabsorb
    lazy_write: true

  # ============================================================
  # Overturning streamfunctions (msftm, msftmmpa)
  # ============================================================

  # msftm — meridional overturning in density space
  # Input: dMOC from FESOM (ldiag_dMOC=.true.), already a (lat, rho) streamfunction field.
  # Custom step maps dMOC bins to CMIP rho coordinate and computes cumulative streamfunction.
  # DISABLED: pipeline function not implemented (compute_msftm[m(pa)]_*).
  # - name: msftm_mon
  # inputs:
  # - path: *dp
  # pattern: dMOC\.fesom\..*\.nc
  # compound_name: ocean.msftm.tavg-rho-hyb-sea.mon.GLB
  # model_variable: dMOC
  # reference_density: 1025.0
  # pipelines:
  # - msftm_density_pipeline

  # msftmmpa — MOC due to parameterized mesoscale advection, depth-space
  # Input: bolus_v (meridional bolus velocity from GM scheme, m/s).
  # Requires fer_gm=.true. in namelist.io; zero field when GM is disabled.
  # Custom step: integrate bolus_v zonally and cumulatively over depth → (lat, depth) streamfunction.
  # DISABLED: pipeline function not implemented (compute_msftm[m(pa)]_*).
  # - name: msftmmpa_depth_mon
  # inputs:
  # - path: *dp
  # pattern: bolus_v\.fesom\..*\.nc
  # compound_name: ocean.msftmmpa.tavg-ol-hyb-sea.mon.GLB
  # model_variable: bolus_v
  # reference_density: 1025.0
  # lazy_write: true
  # pipelines:
  # - msftmmpa_depth_pipeline

  # msftmmpa — MOC due to parameterized mesoscale advection, density-space
  # Same bolus_v input; custom step bins into density classes instead of depth layers.
  # DISABLED: pipeline function not implemented (compute_msftm[m(pa)]_*).
  # - name: msftmmpa_density_mon
  # inputs:
  # - path: *dp
  # pattern: bolus_v\.fesom\..*\.nc
  # compound_name: ocean.msftmmpa.tavg-rho-hyb-sea.mon.GLB
  # model_variable: bolus_v
  # reference_density: 1025.0
  # lazy_write: true
  # pipelines:
  # - msftmmpa_density_pipeline

  # ============================================================
  # HARD: 3D salt transport (sfx, sfy)
  # ============================================================

  # sfx/sfy — 3D and depth-integrated salt mass transport
  # sfx = u × S × rho_0 × dz; sfy = v × S × rho_0 × dz
  # Primary input: unod/vnod. Salinity loaded as secondary field via
  # salt_path / salt_pattern / salt_variable rule attributes.

  - name: sfx
    inputs:
      - path: *dp
        pattern: unod\.fesom\..*\.nc
    compound_name: ocean.sfx.tavg-ol-hxy-sea.mon.GLB
    model_variable: unod
    salt_path: *dp
    salt_pattern: salt\.fesom\..*\.nc
    salt_variable: salt
    reference_density: 1025.0
    transport_component: x
    lazy_write: true
    pipelines:
      - salt_transport_pipeline

  - name: sfx_int
    inputs:
      - path: *dp
        pattern: unod\.fesom\..*\.nc
    compound_name: ocean.sfx.tavg-u-hxy-sea.mon.GLB
    model_variable: unod
    salt_path: *dp
    salt_pattern: salt\.fesom\..*\.nc
    salt_variable: salt
    reference_density: 1025.0
    transport_component: x
    lazy_write: true
    pipelines:
      - salt_transport_integrated_pipeline

  - name: sfy
    inputs:
      - path: *dp
        pattern: vnod\.fesom\..*\.nc
    compound_name: ocean.sfy.tavg-ol-hxy-sea.mon.GLB
    model_variable: vnod
    salt_path: *dp
    salt_pattern: salt\.fesom\..*\.nc
    salt_variable: salt
    reference_density: 1025.0
    transport_component: y
    lazy_write: true
    pipelines:
      - salt_transport_pipeline

  - name: sfy_int
    inputs:
      - path: *dp
        pattern: vnod\.fesom\..*\.nc
    compound_name: ocean.sfy.tavg-u-hxy-sea.mon.GLB
    model_variable: vnod
    salt_path: *dp
    salt_pattern: salt\.fesom\..*\.nc
    salt_variable: salt
    reference_density: 1025.0
    transport_component: y
    lazy_write: true
    pipelines:
      - salt_transport_integrated_pipeline

  # ============================================================
  # Basin-integrated overturning / heat / salt transports
  # (depth-space MOC, basin northward heat and salt transport).
  # Pipelines use compute_msftmz / compute_hfbasin / compute_sltbasin
  # in examples/custom_steps.py.
  # ============================================================

  - name: msftmz
    inputs:
      - path: *dp
        pattern: w\.fesom\..*\.nc
    compound_name: ocean.msftm.tavg-ol-hyb-sea.mon.GLB
    model_variable: msftmz
    pipelines:
      - msftmz_pipeline

  - name: hfbasin
    inputs:
      - path: *dp
        pattern: vtemp\.fesom\..*\.nc
    compound_name: ocean.hfbasin.tavg-u-hyb-sea.mon.GLB
    model_variable: hfbasin
    pipelines:
      - hfbasin_pipeline

  - name: sltbasin
    inputs:
      - path: *dp
        pattern: vsalt\.fesom\..*\.nc
    compound_name: ocean.sltbasin.tavg-u-hyb-sea.mon.GLB
    model_variable: sltbasin
    pipelines:
      - sltbasin_pipeline
