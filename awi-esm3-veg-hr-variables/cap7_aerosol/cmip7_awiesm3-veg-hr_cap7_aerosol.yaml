# CMIP7 CAP7 Aerosol / AtmosChem Variables — AWI-ESM3-VEG-HR
# Generated from 5 CSVs in cap7_aerosol/
#
# AWI-ESM3-VEG-HR has NO prognostic aerosol (uses MACv2-SP) and NO interactive
# chemistry. Producible variables:
# - toz: total column ozone from prescribed climatology
# - cfc11, cfc12: prescribed WMGHG scalars from input4MIPs forcing files
# See cmip7_cap7_aerosol_todo.md for full variable tracking.

general:
  name: "awiesm3-cmip7-cap7-aerosol"
  cmor_version: "CMIP7"
  mip: "CMIP"
  CMIP7_DReq_metadata: "/home/a/a270092/.cache/pycmor/cmip7_metadata/v1.2.2.4/metadata.json"

pycmor:
  enable_output_subdirs: true
  warn_on_no_rule: False
  parallel: False
  dask_cluster: "slurm"
  dask_n_workers: 1
  dask_cluster_scaling_mode: "fixed"
  dask_cluster_scaling_fixed_jobs: 1

jobqueue:
  slurm:
    name: pycmor-worker
    queue: compute
    account: bb1469
    cores: 16
    memory: 256GB
    walltime: '00:30:00'

pipelines:
  # GHG scalar pipeline: read piControl reference year (1850) from the
  # centennial input4MIPs forcing record, broadcast to 12 monthly timestamps
  # in the model run year, then convert ppt/ppb -> mol/mol via scale_factor.
  # `year` (model year) is injected per-run by examples/repoint_hr_year.py;
  # `forcing_year` is set in the inherit block for piControl semantics.
  # Without this, the rule would emit one output file per year of the input
  # record (273 files for a 1750-2022 forcing file).
  - name: ghg_scalar_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:broadcast_forcing_year_to_monthly
      - script://$PYCMOR_HOME/examples/custom_steps.py:scale_by_constant
      - pycmor.std_lib.set_time_bounds
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset
      - pycmor.std_lib.qc.run_compliance_checker

  # Scale pipeline for toz: tco3 (kg m-2) -> toz (m)
  # toz(m) = tco3(kg/m2) / rho_O3_STP = tco3 / 2.1415
  - name: toz_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:scale_by_constant
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.set_time_bounds
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset
      - pycmor.std_lib.qc.run_compliance_checker

inherit:
  # Write-perf defaults rolled out from HR atm core bench:
  netcdf_write_scheduler: synchronous
  data_path: &dp /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/oifs
  ghg_path: &ghg /work/ab0246/a270092/input/oifs-48r1/cmip7-data/ghg
  # CMIP piControl reference year — read 1850 GHG values from the centennial
  # input4MIPs forcing file regardless of the model run year. The cmor output
  # time axis is rewritten to the model `year` (injected per-run by repoint).
  forcing_year: 1850
  source_id: AWI-ESM3-4-2-veg-HR
  institution_id: AWI
  institution: "Alfred Wegener Institute for Polar and Marine Research"
  experiment_id: piControl
  variant_label: r1i1p1f1
  # Parent/branch metadata: piControl branches from piControl-spinup
  # (CMIP7 experiment CV). The spinup ran 330 years on its own calendar
  # starting 1350-01-01, so the branch at its end is 1680-01-01.
  parent_time_units: "days since 1350-01-01"
  branch_time_in_parent: 120522.0
  # grid_label follows the actual grid of each rule's source, not the tier.
  # g122 OIFS TCo319 reduced Gaussian (421120 cells, incl. its land and
  # 30S-90S subsets), g129 the 640x1296 regular regrid, g130 FESOM DARS
  # nodes, g132 FESOM DARS elements. Rules whose source differs from this
  # default carry their own grid_label. See
  # Essential-Model-Documentation/AWI-ESM3-veg-HR-grids.md
  grid_label: g129
  grid: "OpenIFS TCo319 regridded to a regular 0.278 x 0.281 degree latitude-longitude grid (640 x 1296)"
  nominal_resolution: "25 km"
  time_dimname: time_counter
  output_directory: ./cmorized_output/awiesm3
  # QC: in-pipeline CF + WCRP-CMIP7 compliance check on every saved file.
  qc_enabled: true
  qc_repack: true
  qc_tests: ["cf", "wcrp_cmip7", "aicc"]
  qc_checker_options: ["aicc:grid_config:/work/ab0246/a270092/software/pycmor/awi-esm3-veg-hr-variables/aicc_grid_config.json"]
  qc_ignore_codes: ["VAR004"]

  activity_id: CMIP
  parent_experiment_id: no parent
  calendar: proleptic_gregorian
rules:
  # od550aer dropped: MACv2-SP represents only anthropogenic simple-plume AOD,
  # not total AOD as CMIP7 requires. No prognostic/other aerosol in this config.

  # cfc11: global-mean mole fraction from input4MIPs annual GHG forcing file.
  # CMIP7 registry says units='1E-12' (file values are in ppt, label is the
  # scaling factor); annual -> monthly by ffill in the pipeline.
  - name: cfc11_mon
    inputs:
      - path: *ghg
        pattern: cfc11_input4MIPs_GHGConcentrations_CMIP_CR-CMIP-1-0-0_gm_1750-2022\.nc
    compound_name: atmosChem.cfc11.tavg-u-hm-air.mon.glb
    grid_label: g010  # globales Mittel; CV-TT 2026-09-02: g010 ist das globale Spezialgitter, g190 ein Box-Modell-Gitter
    model_variable: cfc11
    scale_factor: 1.0
    scaled_units: "1E-12"
    skip_input_year_filter: true
    pipelines:
      - ghg_scalar_pipeline

  # cfc12: same shape as cfc11 (ppt -> file labelled 1E-12).
  - name: cfc12_mon
    inputs:
      - path: *ghg
        pattern: cfc12_input4MIPs_GHGConcentrations_CMIP_CR-CMIP-1-0-0_gm_1750-2022\.nc
    compound_name: atmosChem.cfc12.tavg-u-hm-air.mon.glb
    grid_label: g010  # globales Mittel; CV-TT 2026-09-02: g010 ist das globale Spezialgitter, g190 ein Box-Modell-Gitter
    model_variable: cfc12
    scale_factor: 1.0
    scaled_units: "1E-12"
    skip_input_year_filter: true
    pipelines:
      - ghg_scalar_pipeline

  # ch4: global-mean mole fraction from input4MIPs annual GHG forcing file.
  # CMIP7 registry says units='1E-09' (file values are in ppb).
  # Note: AWI-ESM3-VEG-HR uses well-mixed prescribed CH4 (no spatial variation).
  # CMIP7 guidance: "if CH4 is spatially uniform, omit 3D field, report global mean instead."
  - name: ch4_mon
    inputs:
      - path: *ghg
        pattern: ch4_input4MIPs_GHGConcentrations_CMIP_CR-CMIP-1-0-0_gm_1750-2022\.nc
    compound_name: atmosChem.ch4.tavg-u-hm-air.mon.glb
    grid_label: g010  # globales Mittel; CV-TT 2026-09-02: g010 ist das globale Spezialgitter, g190 ein Box-Modell-Gitter
    model_variable: ch4
    scale_factor: 1.0
    scaled_units: "1E-09"
    skip_input_year_filter: true
    pipelines:
      - ghg_scalar_pipeline

  # n2o: same shape as ch4 (ppb -> file labelled 1E-09).
  - name: n2o_mon
    inputs:
      - path: *ghg
        pattern: n2o_input4MIPs_GHGConcentrations_CMIP_CR-CMIP-1-0-0_gm_1750-2022\.nc
    compound_name: atmosChem.n2o.tavg-u-hm-air.mon.glb
    grid_label: g010  # globales Mittel; CV-TT 2026-09-02: g010 ist das globale Spezialgitter, g190 ein Box-Modell-Gitter
    model_variable: n2o
    scale_factor: 1.0
    scaled_units: "1E-09"
    skip_input_year_filter: true
    pipelines:
      - ghg_scalar_pipeline

  # toz: total column ozone from IFS prescribed ozone
  # tco3 (kg m-2) -> toz (m) via division by O3 density at STP (2.1415 kg/m3)
  - name: toz_mon
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_tco3_.*\.nc
    compound_name: aerosol.toz.tavg-u-hxy-u.mon.glb
    model_variable: tco3
    scale_factor: 0.46697
    scaled_units: "m"
    pipelines:
      - toz_pipeline
