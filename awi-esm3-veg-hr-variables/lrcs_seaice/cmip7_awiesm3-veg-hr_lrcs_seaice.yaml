# CMIP7 LRCS Sea Ice Variables — AWI-ESM3-VEG-HR
# Generated from cmip7_LRCSextra_variables_seaIce.csv + ocean_seaIce.csv
#
# Variables NOT included (not available in this configuration):
#   See cmip7_lrcs_seaice_variables_todo.md for full list of blocked variables.

general:
  name: "awiesm3-cmip7-lrcs-seaice"
  cmor_version: "CMIP7"
  mip: "CMIP"
  CMIP7_DReq_metadata: "/home/a/a270092/.cache/pycmor/cmip7_metadata/v1.2.2.3/metadata.json"

pycmor:
  warn_on_no_rule: False
  parallel: False
  dask_cluster: "slurm"
  dask_n_workers: 1
  dask_cluster_scaling_mode: "fixed"
  dask_cluster_scaling_fixed_jobs: 1

jobqueue:
  slurm:
    name: pycmor-worker
    queue: compute
    account: bb1469
    cores: 16
    memory: 256GB
    walltime: '00:30:00'

pipelines:
  # Fraction to percent. Used by siconca/siconca_day (hxy-u, no mask).
  - name: fraction_to_percent_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:fraction_to_percent
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # Fraction to percent + mask where no sea ice. Used by simpconc
  # (hxy-si). Rule must supply aice_path / aice_pattern.
  - name: fraction_to_percent_mask_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:fraction_to_percent
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # Generic: multiply by constant (rho_ice, rho_snow, rho_water, etc.)
  - name: scale_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:scale_by_constant
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # scale_pipeline + mask where no sea ice. For hxy-si rules whose CMIP7
  # cell_methods is ``area: time: mean where sea_ice (mask=siconc)``.
  # Rule must supply aice_path / aice_pattern.
  - name: scale_mask_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:scale_by_constant
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # Like scale_pipeline but with a clip-to-0 step after the sign-flipping
  # scale, so only one branch (e.g. snow melt) survives. Used by snm
  # (hxy-si): the mask_where_no_seaice step enforces CMIP7 cell_methods
  # ``where sea_ice (mask=siconc)``.
  - name: snm_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:scale_by_constant
      - script://$PYCMOR_HOME/examples/custom_steps.py:clip_negative_to_zero
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # Sea ice speed: sqrt(uice² + vice²). hxy-si branding ⇒ mask.
  - name: sispeed_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:compute_sispeed
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # CMIP sfdsi (Downward Sea Ice Basal Salt Flux) reconstructed from
  # fw_ice + sss under linfs (where realsalt is unreachable). hxy-sea
  # variant (sfdsi): no masking — fw_ice is intrinsically zero outside
  # ice so cell_methods ``where sea`` is satisfied by the model itself.
  - name: sfdsi_from_fw_ice_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:compute_sfdsi_from_fw_ice
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # hxy-si variant of sfdsi_from_fw_ice_pipeline for the SImon `sfdsi`
  # (sfdsi_seaice rule). CMIP7 cell_methods on seaIce.sfdsi is
  # ``where sea_ice``; the mask is the only difference from the hxy-sea
  # variant above.
  - name: sfdsi_from_fw_ice_mask_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:compute_sfdsi_from_fw_ice
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # Ice mass transport: velocity × m_ice × cell_width. Both sidmasstranx
  # and sidmasstrany are hxy-u branding (CMIP7 cell_methods is
  # ``area: time: mean`` with no ``where sea_ice``), so no mask step.
  - name: ice_mass_transport_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:compute_ice_mass_transport
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # Average normal stress: (sgm11 + sgm22) / 2. hxy-si branding ⇒ mask.
  - name: sistressave_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:compute_sistressave
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # Maximum shear stress: sqrt(((sgm11-sgm22)/2)² + sgm12²). hxy-si ⇒ mask.
  - name: sistressmax_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:compute_sistressmax
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # Conductive heat flux at ice surface: k_ice*(T_base-T_surface)/h_ice.
  # hxy-si branding ⇒ mask.
  - name: siflcondtop_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:compute_siflcondtop
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # Sea ice heat content: rho_ice*h_ice*(c_ice*(T_mean-T_melt)-L_f)
  - name: sihc_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:compute_sihc
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # Snow heat content: -rho_snow * L_f * h_snow. hxy-si ⇒ mask.
  - name: sisnhc_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:compute_sisnhc
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # Freezing point from SSS → sitempbot. hxy-si ⇒ mask.
  - name: sitempbot_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:compute_sitempbot
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # Freeboard from h_ice and h_snow. hxy-si ⇒ mask.
  - name: sifb_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:compute_sifb
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # Effective melt pond fraction: apnd*(1-ipnd/hpnd)*100. hxy-si ⇒ mask.
  - name: simpeffconc_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:compute_simpeffconc
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # Constant field (e.g. drag coefficient). Used by sidragtop/sidragbot,
  # both hxy-si ⇒ mask.
  - name: constant_field_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:compute_constant_field
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # Regrid from OpenIFS regular grid to FESOM unstructured nodes
  - name: regrid_atm_to_fesom_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:regrid_oifs_to_fesom
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # Regrid from OpenIFS regular grid to FESOM unstructured nodes, then mask to sea-ice-covered nodes
  # `throttle_group: oifs_regrid` caps how many of this family of rules
  # run concurrently (cmorizer applies it via per-group submission
  # limit; default cap 2). With 7 OIFS-regrid rules in lrcs_seaice and
  # `max_in_flight=4` previously, the driver process hit 87 GiB RSS and
  # cascaded 15 rule failures (cli16). See
  # FORENSIC_lrcs_seaice_failure.md.
  - name: regrid_atm_to_fesom_seaice_mask_pipeline
    throttle_group: oifs_regrid
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:regrid_oifs_to_fesom
      - script://$PYCMOR_HOME/examples/custom_steps.py:mask_where_no_seaice
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # Same as above but negates the field at the end. IFS surface heat fluxes
  # (hfls, hfss) are CMIP positive=up; the CMIP sea-ice variants
  # (sifllattop, siflsenstop) are positive=down. Apply a final
  # scale_by_constant(-1) step to flip the sign.
  - name: regrid_atm_to_fesom_seaice_mask_negate_pipeline
    throttle_group: oifs_regrid  # see *_pipeline above for rationale
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:regrid_oifs_to_fesom
      - script://$PYCMOR_HOME/examples/custom_steps.py:mask_where_no_seaice
      - script://$PYCMOR_HOME/examples/custom_steps.py:scale_by_constant
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # Generic hemisphere integral (snow mass, ice area, etc.)
  - name: hemisphere_integral_pipeline
    # integrate_over_hemisphere produces a value in m^2 (sum of a_ice *
    # cell_area). Without handle_unit_conversion afterwards the value
    # stays in raw m^2 (~1e13) and gets labelled with CMIP `1e6 km2`,
    # producing FAIL on the daily siarea/siextent ldiag_cmor-style
    # scalars even though the monthly scalar rules are fine.
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:integrate_over_hemisphere
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # Hemisphere-integral pipeline that ALSO applies a constant scaling
  # after integration. Used by sisnmass (m_snow [m] × cell_area [m²] ×
  # rho_snow [kg/m³] = kg). The unit chain is:
  #   m_snow [m]
  #   -> integrate_over_hemisphere -> values are m³ (volume of snow column)
  #   -> scale_by_constant(rho_snow=330) -> values are kg (mass)
  #      and sets scaled_units (e.g. "kg") on the array.
  #   -> handle_unit_conversion -> kg -> kg (no-op or relabel)
  - name: hemisphere_integral_scale_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:integrate_over_hemisphere
      - script://$PYCMOR_HOME/examples/custom_steps.py:scale_by_constant
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

inherit:
  # Write-perf defaults rolled out from HR atm core bench:
  netcdf_compression_codec: blosc_zstd
  netcdf_compression_level: 3
  netcdf_write_scheduler: synchronous
  data_path: &dp /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/fesom
  oifs_data_path: &odp /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/oifs
  source_id: AWI-ESM-3
  institution_id: AWI
  experiment_id: picontrol
  variant_label: r1i1p1f1
  grid_label: gn
  mesh_path: /work/ab0246/a270092/input/fesom2/dars2
  grid_file: /work/ab0246/a270092/input/fesom2/dars2/mesh.nc
  grid: "FESOM 2.6 unstructured grid DARS (3146761 surface nodes)"
  nominal_resolution: "10 km"
  institution: "Alfred Wegener Institute, Helmholtz Centre for Polar and Marine Research, Bremerhaven, Germany"
  output_directory: ./cmorized_output/awiesm3

rules:
  # ============================================================
  # SImon — DefaultPipeline (direct variable mapping)
  # ============================================================

  # --- Thermodynamic/dynamic area fraction tendencies ---

  - name: sidconcdyn
    inputs:
      - path: *dp
        pattern: dyngrarea\.fesom\..*\.nc
    compound_name: seaIce.sidconcdyn.tavg-u-hxy-sea.mon.glb
    model_variable: dyngrarea
    model_unit: "s-1"

  - name: sidconcth
    inputs:
      - path: *dp
        pattern: thdgrarea\.fesom\..*\.nc
    compound_name: seaIce.sidconcth.tavg-u-hxy-sea.mon.glb
    model_variable: thdgrarea
    model_unit: "s-1"

  # --- Ice strength ---

  - name: sicompstren
    inputs:
      - path: *dp
        pattern: strength_ice\.fesom\..*\.nc
    compound_name: seaIce.sicompstren.tavg-u-hxy-si.mon.glb
    model_variable: strength_ice
    model_unit: "N m-1"

  # --- Atmospheric stress on sea ice ---

  - name: sistrxdtop
    inputs:
      - path: *dp
        pattern: atmice_x\.fesom\..*\.nc
    compound_name: seaIce.sistrxdtop.tavg-u-hxy-si.mon.glb
    model_variable: atmice_x

  - name: sistrydtop
    inputs:
      - path: *dp
        pattern: atmice_y\.fesom\..*\.nc
    compound_name: seaIce.sistrydtop.tavg-u-hxy-si.mon.glb
    model_variable: atmice_y

  # --- Ocean stress on sea ice ---

  - name: sistrxubot
    inputs:
      - path: *dp
        pattern: iceoce_x\.fesom\..*\.nc
    compound_name: seaIce.sistrxubot.tavg-u-hxy-si.mon.glb
    model_variable: iceoce_x

  - name: sistryubot
    inputs:
      - path: *dp
        pattern: iceoce_y\.fesom\..*\.nc
    compound_name: seaIce.sistryubot.tavg-u-hxy-si.mon.glb
    model_variable: iceoce_y

  # --- Conductive heat flux at ice base ---

  - name: siflcondbot
    inputs:
      - path: *dp
        pattern: qcon\.fesom\..*\.nc
    compound_name: seaIce.siflcondbot.tavg-u-hxy-si.mon.glb
    model_variable: qcon

  # ============================================================
  # SImon — scale_pipeline (multiply by constant for unit conversion)
  # ============================================================

  # --- Mass change from dynamics: dyngrice [m/s] × rho_ice → kg m-2 s-1 ---

  - name: sidmassdyn
    inputs:
      - path: *dp
        pattern: dyngrice\.fesom\..*\.nc
    compound_name: seaIce.sidmassdyn.tavg-u-hxy-si.mon.glb
    model_variable: dyngrice
    scale_factor: 910.0
    scaled_units: "kg m-2 s-1"
    aice_path: *dp
    aice_pattern: a_ice\.fesom\..*\.nc
    pipelines:
      - scale_mask_pipeline

  # --- Mass change from thermodynamics: thdgrice [m/s] × rho_ice → kg m-2 s-1 ---

  - name: sidmassth
    inputs:
      - path: *dp
        pattern: thdgrice\.fesom\..*\.nc
    compound_name: seaIce.sidmassth.tavg-u-hxy-si.mon.glb
    model_variable: thdgrice
    scale_factor: 910.0
    scaled_units: "kg m-2 s-1"
    aice_path: *dp
    aice_pattern: a_ice\.fesom\..*\.nc
    pipelines:
      - scale_mask_pipeline

  # --- Snow melt rate: thdgrsn [m/s] × rho_snow → kg m-2 s-1 ---

  - name: snm
    # FESOM `thdgrsnw` is the NET thermodynamic snow thickness change:
    #   > 0 → snow accumulates (snowfall > melt+sublimation)
    #   < 0 → snow melts faster than it accumulates
    # CMIP `snm` is the snow MELT rate, positive when melting and 0
    # otherwise. So we flip the sign (-330 = -ρ_snow) and clip the
    # accumulation branch to 0 in the snm_pipeline. hxy-si ⇒ pipeline
    # also masks to NaN where a_ice == 0.
    inputs:
      - path: *dp
        pattern: thdgrsnw\.fesom\..*\.nc
    compound_name: seaIce.snm.tavg-u-hxy-si.mon.glb
    model_variable: thdgrsnw
    scale_factor: -330.0
    scaled_units: "kg m-2 s-1"
    aice_path: *dp
    aice_pattern: a_ice\.fesom\..*\.nc
    pipelines:
      - snm_pipeline

  # --- Freshwater flux from sea ice: fw_ice [m/s] × rho_water → kg m-2 s-1 ---

  - name: siflfwbot
    inputs:
      - path: *dp
        pattern: fw_ice\.fesom\..*\.nc
    compound_name: seaIce.siflfwbot.tavg-u-hxy-si.mon.glb
    model_variable: fw_ice
    scale_factor: 1000.0
    scaled_units: "kg m-2 s-1"
    aice_path: *dp
    aice_pattern: a_ice\.fesom\..*\.nc
    pipelines:
      - scale_mask_pipeline

  # --- Freshwater flux from sea-ice surface (snow): fw_snw [m/s] × rho_water → kg m-2 s-1 ---

  - name: siflfwdrain
    inputs:
      - path: *dp
        pattern: fw_snw\.fesom\..*\.nc
    compound_name: seaIce.siflfwdrain.tavg-u-hxy-si.mon.glb
    model_variable: fw_snw
    scale_factor: 1000.0
    scaled_units: "kg m-2 s-1"
    aice_path: *dp
    aice_pattern: a_ice\.fesom\..*\.nc
    pipelines:
      - scale_mask_pipeline

  # --- Salt mass in sea ice ---
  #
  # FESOM's `m_ice` is effective ice height per cell area (units 'm';
  # def_stream in io_meandata.F90 long_name "ice height per unit area"),
  # NOT mass per area as an earlier draft of this rule assumed. The
  # correct conversion to salt mass per cell area is:
  #
  #     sisaltmass [kg/m²] = (sice/1000) × m_ice [m] × rho_ice [kg/m³]
  #                       = 0.004 × m_ice × 910
  #                       = 3.64 × m_ice
  #
  # Verified: sice = 4.0 psu from
  # `/work/bb1469/.../Final_CMIP7_IO_Test_06/config/fesom/namelist.ice`;
  # rhoice = 910 (AOMIP) from `MOD_ICE.F90:61`. Earlier rule used
  # scale_factor=0.004 which omitted rho_ice — output was ~1000× too low.

  - name: sisaltmass
    inputs:
      - path: *dp
        pattern: m_ice\.fesom\..*\.nc
    compound_name: seaIce.sisaltmass.tavg-u-hxy-si.mon.glb
    model_variable: m_ice
    scale_factor: 3.64       # (sice/1000) * rho_ice = 0.004 * 910
    scaled_units: "kg m-2"
    aice_path: *dp
    aice_pattern: a_ice\.fesom\..*\.nc
    pipelines:
      - scale_mask_pipeline

  # ============================================================
  # SImon — multi-variable compute pipelines
  # ============================================================

  - name: sispeed
    inputs:
      - path: *dp
        pattern: uice\.fesom\..*\.nc
    compound_name: seaIce.sispeed.tavg-u-hxy-si.mon.glb
    model_variable: uice
    second_input_path: /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/fesom
    second_input_pattern: vice\.fesom\..*\.nc
    second_variable: vice
    aice_path: *dp
    aice_pattern: a_ice\.fesom\..*\.nc
    pipelines:
      - sispeed_pipeline

  # CMIP7 sidmasstran[xy] are in kg/s (total mass crossing a cell edge
  # per unit time), not kg/(m·s). compute_ice_mass_transport now
  # multiplies by rho_ice (910 kg/m³ AOMIP) and sqrt(cell_area) from
  # grid_file (inherited) to convert FESOM's m_ice [m] × uice [m/s]
  # into kg/s. Previously the rule wrote m²/s mislabelled kg/s.
  - name: sidmasstranx
    inputs:
      - path: *dp
        pattern: uice\.fesom\..*\.nc
    compound_name: seaIce.sidmasstranx.tavg-u-hxy-u.mon.glb
    model_variable: uice
    mice_path: /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/fesom
    mice_pattern: m_ice\.fesom\..*\.nc
    rho_ice: 910.0
    pipelines:
      - ice_mass_transport_pipeline

  - name: sidmasstrany
    inputs:
      - path: *dp
        pattern: vice\.fesom\..*\.nc
    compound_name: seaIce.sidmasstrany.tavg-u-hxy-u.mon.glb
    model_variable: vice
    mice_path: /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/fesom
    mice_pattern: m_ice\.fesom\..*\.nc
    rho_ice: 910.0
    pipelines:
      - ice_mass_transport_pipeline

  # --- Stress tensor derived (mEVP: sgm11, sgm12, sgm22) ---

  - name: sistressave
    inputs:
      - path: *dp
        pattern: sgm11\.fesom\..*\.nc
    compound_name: seaIce.sistressave.tpt-u-hxy-si.mon.glb
    model_variable: sgm11
    sgm22_path: /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/fesom
    sgm22_pattern: sgm22\.fesom\..*\.nc
    aice_path: *dp
    aice_pattern: a_ice\.fesom\..*\.nc
    pipelines:
      - sistressave_pipeline

  - name: sistressmax
    inputs:
      - path: *dp
        pattern: sgm11\.fesom\..*\.nc
    compound_name: seaIce.sistressmax.tpt-u-hxy-si.mon.glb
    model_variable: sgm11
    sgm22_path: /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/fesom
    sgm22_pattern: sgm22\.fesom\..*\.nc
    sgm12_path: /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/fesom
    sgm12_pattern: sgm12\.fesom\..*\.nc
    aice_path: *dp
    aice_pattern: a_ice\.fesom\..*\.nc
    pipelines:
      - sistressmax_pipeline

  # ============================================================
  # SImon — cross-realm (ocean seaIce) freshwater/salt fluxes
  # ============================================================

  # Downward sea ice basal salt flux. Under linfs (use_virt_salt=.true.)
  # FESOM never populates real_salt_flux (ice_thermo_cpl.F90 branch is gated
  # off), so the legacy realsalt-based recipe produced zeros. Reconstruct
  # the physical salt flux from the ice freshwater flux fw_ice and surface
  # salinity sss:  sfdsi = -rho_w · (sss/1000) · fw_ice.
  - name: sfdsi
    inputs:
      - path: *dp
        pattern: fw_ice\.fesom\..*\.nc
    compound_name: ocean.sfdsi.tavg-u-hxy-sea.mon.glb
    model_variable: fw_ice
    sss_path: /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/fesom
    sss_pattern: sss\.fesom\..*\.nc
    sss_variable: sss
    reference_density: 1025.0
    pipelines:
      - sfdsi_from_fw_ice_pipeline

  # Same physical quantity in the SImon table. fw_ice is intrinsically
  # zero outside sea ice, so the field is already where_sea_ice in
  # value terms; CMIP7 cell_methods on seaIce.sfdsi nevertheless says
  # ``where sea_ice (mask=siconc)``, so use the masked variant to write
  # NaN (not 0) outside the ice pack.
  - name: sfdsi_seaice
    inputs:
      - path: *dp
        pattern: fw_ice\.fesom\..*\.nc
    compound_name: seaIce.sfdsi.tavg-u-hxy-si.mon.glb
    model_variable: fw_ice
    sss_path: /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/fesom
    sss_pattern: sss\.fesom\..*\.nc
    sss_variable: sss
    reference_density: 1025.0
    aice_path: *dp
    aice_pattern: a_ice\.fesom\..*\.nc
    pipelines:
      - sfdsi_from_fw_ice_mask_pipeline

  # Virtual salt flux into sea water from ice thermodynamics
  - name: vsfsit
    inputs:
      - path: *dp
        pattern: virtsalt\.fesom\..*\.nc
    compound_name: ocean.vsfsit.tavg-u-hxy-sea.mon.glb
    model_variable: virtsalt
    scale_factor: 1.0
    scaled_units: "kg m-2 s-1"
    pipelines:
      - scale_pipeline

  # Water flux into ocean from ice thermodynamics (Omon table)
  - name: siflfwbot_omon
    inputs:
      - path: *dp
        pattern: fw_ice\.fesom\..*\.nc
    compound_name: ocean.siflfwbot.tavg-u-hxy-sea.mon.glb
    model_variable: fw_ice
    scale_factor: 1000.0
    scaled_units: "kg m-2 s-1"
    pipelines:
      - scale_pipeline

  # ============================================================
  # SImon — post-processed from available output
  # ============================================================

  # Conductive heat flux at ice surface
  # qcond_top = k_ice * (T_base - T_surface) / h_ice
  - name: siflcondtop
    inputs:
      - path: *dp
        pattern: ist\.fesom\..*\.nc
    compound_name: seaIce.siflcondtop.tavg-u-hxy-si.mon.glb
    model_variable: ist
    sss_path: /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/fesom
    sss_pattern: sss\.fesom\..*\.nc
    hice_path: /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/fesom
    hice_pattern: h_ice\.fesom\..*\.nc
    aice_path: *dp
    aice_pattern: a_ice\.fesom\..*\.nc
    k_ice: 2.1656
    pipelines:
      - siflcondtop_pipeline

  # Sea ice heat content
  - name: sihc
    inputs:
      - path: *dp
        pattern: h_ice\.fesom\..*\.nc
    compound_name: seaIce.sihc.tavg-u-hxy-sea.mon.glb
    model_variable: h_ice
    ist_path: /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/fesom
    ist_pattern: ist\.fesom\..*\.nc
    sss_path: /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/fesom
    sss_pattern: sss\.fesom\..*\.nc
    rho_ice: 910.0
    c_ice: 2090.0
    L_f: 334000.0
    pipelines:
      - sihc_pipeline

  # Snow heat content: -rho_snow * L_f * h_snow (latent heat dominates)
  - name: sisnhc
    inputs:
      - path: *dp
        pattern: h_snow\.fesom\..*\.nc
    compound_name: seaIce.sisnhc.tavg-u-hxy-si.mon.glb
    model_variable: h_snow
    rho_snow: 330.0
    L_f: 334000.0
    aice_path: *dp
    aice_pattern: a_ice\.fesom\..*\.nc
    pipelines:
      - sisnhc_pipeline

  # Temperature at ice-ocean interface (freezing point from SSS)
  - name: sitempbot
    inputs:
      - path: *dp
        pattern: sss\.fesom\..*\.nc
    compound_name: seaIce.sitempbot.tavg-u-hxy-si.mon.glb
    model_variable: sss
    aice_path: *dp
    aice_pattern: a_ice\.fesom\..*\.nc
    pipelines:
      - sitempbot_pipeline

  # Sea ice freeboard from h_ice and h_snow
  - name: sifb
    inputs:
      - path: *dp
        pattern: h_ice\.fesom\..*\.nc
    compound_name: seaIce.sifb.tavg-u-hxy-si.mon.glb
    model_variable: h_ice
    snow_path: /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/fesom
    snow_pattern: h_snow\.fesom\..*\.nc
    snow_variable: h_snow
    rho_ice: 910.0
    rho_snow: 330.0
    rho_water: 1025.0
    aice_path: *dp
    aice_pattern: a_ice\.fesom\..*\.nc
    pipelines:
      - sifb_pipeline

  # Atmospheric drag coefficient (constant from namelist.ice: cd_atm_ice=0.0012 — verify against runtime namelist)
  - name: sidragtop
    inputs:
      - path: *dp
        pattern: a_ice\.fesom\..*\.nc
    compound_name: seaIce.sidragtop.tavg-u-hxy-si.mon.glb
    model_variable: a_ice
    constant_value: 0.0012
    constant_units: "1"
    aice_path: *dp
    aice_pattern: a_ice\.fesom\..*\.nc
    pipelines:
      - constant_field_pipeline

  # Ocean drag coefficient (constant from namelist.ice: cd_oce_ice=0.0055)
  - name: sidragbot
    inputs:
      - path: *dp
        pattern: a_ice\.fesom\..*\.nc
    compound_name: seaIce.sidragbot.tavg-u-hxy-si.mon.glb
    model_variable: a_ice
    constant_value: 0.0055
    constant_units: "1"
    aice_path: *dp
    aice_pattern: a_ice\.fesom\..*\.nc
    pipelines:
      - constant_field_pipeline

  # Snow mass on sea ice — Northern Hemisphere
  #
  # FESOM `m_snow` is snow depth (m) per node. integrate_over_hemisphere
  # multiplies by cell_area → values become snow VOLUME (m³, mislabeled
  # as "m" by the helper's attrs.copy). Multiplying by rho_snow gives
  # snow MASS (kg). The handle_unit_conversion step that the pipeline
  # added in commit e0e93ee now correctly refuses m → kg (different
  # dimensions); the fix is to apply rho_snow inside the pipeline before
  # the unit conversion via the new hemisphere_integral_scale_pipeline.
  - name: sisnmass_north
    inputs:
      - path: *dp
        pattern: m_snow\.fesom\..*\.nc
    compound_name: seaIce.sisnmass.tavg-u-hm-si.mon.nh
    model_variable: m_snow
    hemisphere: "N"
    scale_factor: 330.0       # rho_snow, kg/m³ (matches FESOM default)
    scaled_units: "kg"
    pipelines:
      - hemisphere_integral_scale_pipeline

  - name: sisnmass_south
    inputs:
      - path: *dp
        pattern: m_snow\.fesom\..*\.nc
    compound_name: seaIce.sisnmass.tavg-u-hm-si.mon.sh
    model_variable: m_snow
    hemisphere: "S"
    scale_factor: 330.0
    scaled_units: "kg"
    pipelines:
      - hemisphere_integral_scale_pipeline

  # ============================================================
  # SImon — melt ponds (use_meltponds=.true.)
  # FESOM outputs: apnd (area frac), hpnd (depth), ipnd (lid thickness)
  # ============================================================

  - name: simpconc
    inputs:
      - path: *dp
        pattern: apnd\.fesom\..*\.nc
    compound_name: seaIce.simpconc.tavg-u-hxy-si.mon.glb
    model_variable: apnd
    aice_path: *dp
    aice_pattern: a_ice\.fesom\..*\.nc
    pipelines:
      - fraction_to_percent_mask_pipeline

  - name: simpthick
    inputs:
      - path: *dp
        pattern: hpnd\.fesom\..*\.nc
    compound_name: seaIce.simpthick.tavg-u-hxy-simp.mon.glb
    model_variable: hpnd

  - name: simprefrozen
    inputs:
      - path: *dp
        pattern: ipnd\.fesom\..*\.nc
    compound_name: seaIce.simprefrozen.tavg-u-hxy-simp.mon.glb
    model_variable: ipnd

  - name: simpeffconc
    inputs:
      - path: *dp
        pattern: apnd\.fesom\..*\.nc
    compound_name: seaIce.simpeffconc.tavg-u-hxy-si.mon.glb
    model_variable: apnd
    ipnd_path: /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/fesom
    ipnd_pattern: ipnd\.fesom\..*\.nc
    hpnd_path: /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/fesom
    hpnd_pattern: hpnd\.fesom\..*\.nc
    aice_path: *dp
    aice_pattern: a_ice\.fesom\..*\.nc
    pipelines:
      - simpeffconc_pipeline

  # ============================================================
  # SImon — hemisphere-integrated scalars (ldiag_cmor=.true.)
  # ============================================================

  # FESOM ldiag_cmor scalars come out in `1e12 m2` (mathematically identical
  # to CMIP `1e6 km2`). Without this declaration pycmor's pint pass parses
  # the FESOM units literally and ends up multiplying values by 1e12.
  - name: siarea_north
    inputs:
      - path: *dp
        pattern: siarean\.fesom\..*\.nc
    compound_name: seaIce.siarea.tavg-u-hm-u.mon.nh
    model_variable: siarean
    model_unit: "1e12 m2"

  - name: siarea_south
    inputs:
      - path: *dp
        pattern: siareas\.fesom\..*\.nc
    compound_name: seaIce.siarea.tavg-u-hm-u.mon.sh
    model_variable: siareas
    model_unit: "1e12 m2"

  # Daily siarea: ldiag_cmor scalars are monthly-only; compute from gridded a_ice
  # integrate_over_hemisphere returns sum(a_ice * cell_area) in m2 — pint converts to "1e6 km2".
  - name: siarea_north_day
    inputs:
      - path: *dp
        pattern: a_ice\.fesom\..*\.nc
    compound_name: seaIce.siarea.tavg-u-hm-u.day.nh
    model_variable: a_ice
    model_unit: "m2"
    hemisphere: "N"
    pipelines:
      - hemisphere_integral_pipeline

  - name: siarea_south_day
    inputs:
      - path: *dp
        pattern: a_ice\.fesom\..*\.nc
    compound_name: seaIce.siarea.tavg-u-hm-u.day.sh
    model_variable: a_ice
    model_unit: "m2"
    hemisphere: "S"
    pipelines:
      - hemisphere_integral_pipeline

  - name: siextent_north
    inputs:
      - path: *dp
        pattern: siextentn\.fesom\..*\.nc
    compound_name: seaIce.siextent.tavg-u-hm-u.mon.nh
    model_variable: siextentn
    model_unit: "1e12 m2"

  - name: siextent_south
    inputs:
      - path: *dp
        pattern: siextents\.fesom\..*\.nc
    compound_name: seaIce.siextent.tavg-u-hm-u.mon.sh
    model_variable: siextents
    model_unit: "1e12 m2"

  # Daily siextent: ldiag_cmor scalars are monthly-only; compute from gridded a_ice with 15% threshold
  # integrate_over_hemisphere returns sum(1{a_ice>0.15} * cell_area) in m2 — pint converts to "1e6 km2".
  - name: siextent_north_day
    inputs:
      - path: *dp
        pattern: a_ice\.fesom\..*\.nc
    compound_name: seaIce.siextent.tavg-u-hm-u.day.nh
    model_variable: a_ice
    model_unit: "m2"
    hemisphere: "N"
    extent_threshold: 0.15
    pipelines:
      - hemisphere_integral_pipeline

  - name: siextent_south_day
    inputs:
      - path: *dp
        pattern: a_ice\.fesom\..*\.nc
    compound_name: seaIce.siextent.tavg-u-hm-u.day.sh
    model_variable: a_ice
    model_unit: "m2"
    hemisphere: "S"
    extent_threshold: 0.15
    pipelines:
      - hemisphere_integral_pipeline

  - name: sivol_north
    inputs:
      - path: *dp
        pattern: sivoln\.fesom\..*\.nc
    compound_name: seaIce.sivol.tavg-u-hm-u.mon.nh
    model_variable: sivoln

  - name: sivol_south
    inputs:
      - path: *dp
        pattern: sivols\.fesom\..*\.nc
    compound_name: seaIce.sivol.tavg-u-hm-u.mon.sh
    model_variable: sivols

  # Daily sivol: using ldiag_cmor scalar files (same as monthly); if daily scalar output not available,
  # enable daily m_ice in namelist.io and switch to m_ice + hemisphere_integral_pipeline
  - name: sivol_north_day
    inputs:
      - path: *dp
