  # Net latent heat flux over sea ice: OpenIFS hfls regridded to FESOM nodes.
  # Note: OpenIFS hfls is total latent heat flux over all surfaces; no
  # ice-tile-specific diagnostic available. Source file `atmos_1h_sfc_hfls_*.nc`
  # is the CMIP7 atmos output, native reduced-Gaussian grid, already in W m-2
  # with CMIP sign convention (file_def applies `-slhf/3600`). Hourly cadence
  # is timeavg'd to monthly downstream — same path as the rsds/rsus_seaice
  # family, currently F4-blocked (see DESIGN_PROPOSAL_recipe_failures_post_cli.md
  # §3.4); ships once F4 is closed.
  # The previous `atmos_mon_land_slhf_*.nc` pattern doesn't exist in OIFS
  # output — only `atmos_1h_sfc_*` and `atm_remapped_1m_*` variants of
  # slhf/sshf are produced; atm_remapped_* isn't CMIP7 output (default-on
  # diagnostic stream that may not always be enabled), so we use atmos_*.
  - name: sifllattop
    # IFS hfls is CMIP positive=up (surface_upward_latent_heat_flux). CMIP
    # sifllattop is positive=down (surface_downward_latent_heat_flux over
    # sea ice). Use the *_negate_pipeline so scale_by_constant(-1) flips
    # the sign.
    inputs:
      - path: *odp
        pattern: atmos_1h_sfc_hfls_.*\.nc
    compound_name: seaIce.sifllattop.tavg-u-hxy-si.mon.glb
    model_variable: hfls
    scale_factor: -1.0
    time_dimname: time_counter
    aice_path: /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/fesom
    aice_pattern: a_ice\.fesom\..*\.nc
    lazy_write: true
    pipelines:
      - regrid_atm_to_fesom_seaice_mask_negate_pipeline

  # Net sensible heat flux over sea ice: OpenIFS hfss regridded to FESOM nodes.
  # Same pattern as sifllattop above — atmos_1h_sfc_hfss_*.nc is the CMIP7
  # atmos output (file_def applies `-sshf/3600`); F4-blocked until that's
  # closed.
  - name: siflsenstop
    # IFS hfss is CMIP positive=up (surface_upward_sensible_heat_flux). CMIP
    # siflsenstop is positive=down (surface_downward_sensible_heat_flux over
    # sea ice). Use the *_negate_pipeline.
    inputs:
      - path: *odp
        pattern: atmos_1h_sfc_hfss_.*\.nc
    compound_name: seaIce.siflsenstop.tavg-u-hxy-si.mon.glb
    model_variable: hfss
    scale_factor: -1.0
    time_dimname: time_counter
    aice_path: /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/fesom
    aice_pattern: a_ice\.fesom\..*\.nc
    lazy_write: true
