# CMIP7 VEG Sea Ice Variables — AWI-ESM3-VEG-HR
#
# 1 producible variable (daily sisnhc); 3 blocked (see cmip7_veg_seaice_todo.md).
# Daily sisnhc derived from daily m_snow and a_ice (h_snow not available daily).

general:
  name: "awiesm3-cmip7-veg-seaice"
  cmor_version: "CMIP7"
  mip: "CMIP"
  CMIP7_DReq_metadata: "/home/a/a270092/.cache/pycmor/cmip7_metadata/v1.2.2.4/metadata.json"

pycmor:
  enable_output_subdirs: true
  warn_on_no_rule: False
  parallel: False
  dask_cluster: "slurm"
  dask_n_workers: 1
  dask_cluster_scaling_mode: "fixed"
  dask_cluster_scaling_fixed_jobs: 1

jobqueue:
  slurm:
    name: pycmor-worker
    queue: compute
    account: bb1469
    cores: 16
    memory: 256GB
    walltime: '00:30:00'

pipelines:
  # Snow heat content from daily m_snow + a_ice
  # h_snow = m_snow / (rho_snow * a_ice), sisnhc = -rho_snow * L_f * h_snow.
  # compute_sisnhc_from_msnow fills 0.0 where a_ice==0; the trailing
  # mask_where_no_seaice flips those zeros back to NaN so the written
  # field matches CMIP7 cell_methods ``where sea_ice (mask=siconc)``.
  - name: sisnhc_from_msnow_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:compute_sisnhc_from_msnow
      - script://$PYCMOR_HOME/examples/custom_steps.py:mask_where_no_seaice
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.set_time_bounds
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset
      - pycmor.std_lib.qc.run_compliance_checker

inherit:
  # Tier-wide throttle: HDF5-write-lock parallel-save protection.
  # (cli45 veg_seaice died from an unrelated prefect sqlite race, but
  # this tier shares the same single-rule-no-pipeline structure that
  # bit core_seaice/lrcs_seaice and is equally vulnerable.) Cap=1 via
  # PYCMOR_THROTTLE_CAPS forces strict serial.
  throttle_group: veg_seaice_serial
  # Write-perf defaults rolled out from HR atm core bench:
  netcdf_compression_codec: blosc_zstd
  netcdf_compression_level: 3
  netcdf_write_scheduler: synchronous
  data_path: &dp /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/fesom
  source_id: AWI-ESM3-4-2-veg-HR
  institution_id: AWI
  institution: "Alfred Wegener Institute for Polar and Marine Research"
  experiment_id: piControl
  variant_label: r1i1p1f1
  grid_label: g130
  mesh_path: /work/ab0246/a270092/input/fesom2/dars2
  grid_file: /work/ab0246/a270092/input/fesom2/dars2/mesh.nc
  grid: "FESOM 2.7 DARS unstructured mesh (~10 km nominal, 3146761 nodes)"
  nominal_resolution: "10 km"
  output_directory: ./cmorized_output/awiesm3
  # QC: in-pipeline CF + WCRP-CMIP7 compliance check on every saved file.
  qc_enabled: true
  qc_repack: true
  qc_tests: ["cf", "wcrp_cmip7"]
  qc_ignore_codes: ["VAR004"]

  activity_id: CMIP
  parent_experiment_id: no parent
  calendar: proleptic_gregorian
rules:
  # Daily snow heat content: derived from daily m_snow and a_ice
  # sisnhc = -L_f * m_snow / a_ice (latent heat dominates, sensible ≈ 0)
  - name: sisnhc_day
    inputs:
      - path: *dp
        pattern: m_snow\.fesom\.\d{4}\.nc
    compound_name: seaIce.sisnhc.tavg-u-hxy-si.day.glb
    model_variable: m_snow
    second_input_path: *dp
    second_input_pattern: a_ice\.fesom\.\d{4}\.nc
    second_variable: a_ice
    aice_path: *dp
    aice_pattern: a_ice\.fesom\.\d{4}\.nc
    rho_snow: 330.0
    L_f: 334000.0
    pipelines:
      - sisnhc_from_msnow_pipeline
