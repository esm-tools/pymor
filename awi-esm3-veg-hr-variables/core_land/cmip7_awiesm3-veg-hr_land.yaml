# CMIP7 Core Land Variables — AWI-ESM3-VEG-HR
# Generated from cmip7_all_core_variables_{land,atmos_land,landIce_land}.csv
#
# XIOS expressions handle deaccumulation and unit conversion in field_def_cmip7.xml.
# Variables not producible from IFS alone (evspsblsoi, evspsblveg, rootd,
# mrsofc, sftgif, mrfso) are deferred to lrcs_land (LPJ-GUESS / external data).

general:
  name: "awiesm3-cmip7-core-land"
  cmor_version: "CMIP7"
  mip: "CMIP"
  CMIP7_DReq_metadata: "/home/a/a270092/.cache/pycmor/cmip7_metadata/v1.2.2.3/metadata.json"

pycmor:
  enable_output_subdirs: true
  warn_on_no_rule: False
  parallel: False
  dask_cluster: "slurm"
  dask_n_workers: 1
  dask_cluster_scaling_mode: "fixed"
  dask_cluster_scaling_fixed_jobs: 1

jobqueue:
  slurm:
    name: pycmor-worker
    queue: compute
    account: bb1469
    cores: 16
    memory: 256GB
    walltime: '00:30:00'

pipelines:
  - name: snc_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:compute_snc
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.set_time_bounds
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset
      - pycmor.std_lib.qc.run_compliance_checker

  # areacella: reuse pycmor std_lib FrozenPipeline
  - name: areacella_pipeline
    uses: pycmor.core.pipeline.AreacellaFxPipeline

  - name: slthick_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:compute_slthick
      - pycmor.std_lib.set_time_bounds
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset
      - pycmor.std_lib.qc.run_compliance_checker

inherit:
  # Write-perf defaults rolled out from HR atm core bench:
  netcdf_compression_codec: blosc_zstd
  netcdf_compression_level: 3
  netcdf_write_scheduler: synchronous
  data_path: &dp /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/oifs
  source_id: AWI-ESM3-4-2-veg-HR
  institution_id: AWI
  institution: "Alfred Wegener Institute for Polar and Marine Research"
  experiment_id: piControl
  variant_label: r1i1p1f1
  grid_label: g122
  grid: "OpenIFS TCo319 reduced Gaussian (~25 km) — LPJ-GUESS on OIFS grid"
  nominal_resolution: "25 km"
  time_dimname: time_counter
  output_directory: ./cmorized_output/awiesm3
  # QC: in-pipeline CF + WCRP-CMIP7 compliance check on every saved file.
  qc_enabled: true
  qc_repack: true
  qc_tests: ["cf", "wcrp_cmip7"]
  qc_ignore_codes: ["VAR004"]

  activity_id: CMIP
  parent_experiment_id: no parent
  calendar: proleptic_gregorian
rules:
  # ============================================================
  # Monthly land surface (Lmon)
  # ============================================================

  # --- XIOS CMOR-ready fields ---

  - name: evspsbl
    inputs:
      - path: *dp
        pattern: atmos_mon_land_evspsbl_.*\.nc
    compound_name: atmos.evspsbl.tavg-u-hxy-u.mon.glb
    model_variable: evspsbl

  - name: mrro
    inputs:
      - path: *dp
        pattern: atmos_mon_land_mrro_.*\.nc
    compound_name: land.mrro.tavg-u-hxy-lnd.mon.glb
    model_variable: mrro

  - name: mrros
    inputs:
      - path: *dp
        pattern: atmos_mon_land_mrros_.*\.nc
    compound_name: land.mrros.tavg-u-hxy-lnd.mon.glb
    model_variable: mrros

  - name: snw
    inputs:
      - path: *dp
        pattern: atmos_mon_land_snw_.*\.nc
    compound_name: landIce.snw.tavg-u-hxy-lnd.mon.glb
    model_variable: snw

  - name: orog
    inputs:
      - path: *dp
        pattern: atmos_mon_land_orog_.*\.nc
    compound_name: land.orog.ti-u-hxy-u.fx.glb
    model_variable: orog

  - name: lai
    inputs:
      - path: *dp
        pattern: atmos_mon_land_lai_.*\.nc
    compound_name: land.lai.tavg-u-hxy-lnd.mon.glb
    model_variable: lai

  - name: mrso
    inputs:
      - path: *dp
        pattern: atmos_mon_land_mrso_.*\.nc
    compound_name: land.mrso.tavg-u-hxy-lnd.mon.glb
    model_variable: mrso

  - name: mrsol
    inputs:
      - path: *dp
        pattern: atmos_mon_land_mrsol_.*\.nc
    compound_name: land.mrsol.tavg-d10cm-hxy-lnd.mon.glb
    model_variable: mrsol

  # --- pycmor pipeline computed ---

  - name: snc
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_sd_.*\.nc
    compound_name: landIce.snc.tavg-u-hxy-lnd.mon.glb
    model_variable: sd
    pipelines:
      - snc_pipeline

  # ============================================================
  # Fixed (fx) variables
  # ============================================================

  # Duplicates the core_atm/.../areacella rule on the same compound
  # `atmos.areacella.ti-u-hxy-u.fx.GLB`. Kept here too because each tier
  # is processed as a stand-alone job and needs areacella in its own
  # cmorized/ subtree for cell_measures resolution. Outputs are byte-
  # identical to the core_atm copy (verified: sum/mean/min/max match to
  # f64 precision), so consumers can use whichever copy they encounter.
  - name: areacella
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_lsm_.*\.nc
    compound_name: atmos.areacella.ti-u-hxy-u.fx.glb
    model_variable: lsm
    pipelines:
      - areacella_pipeline

  - name: slthick
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_lsm_.*\.nc
    compound_name: land.slthick.ti-sl-hxy-lnd.fx.glb
    model_variable: lsm
    pipelines:
      - slthick_pipeline
