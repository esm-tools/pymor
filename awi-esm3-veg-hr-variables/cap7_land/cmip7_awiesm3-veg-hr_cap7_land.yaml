  # DISABLED: collides with core_land/.../evspsbl rule. Both emit the
  # same compound `atmos.evspsbl.tavg-u-hxy-u.mon.GLB` and the file
  # metadata is identical (long_name, standard_name, cell_methods,
  # realm — all same), so downstream tools can't tell the LPJ-GUESS
  # value from the OIFS coupled value. CMIP7's canonical `evspsbl`
  # is the IFS coupled water flux to atmosphere, which is what
  # core_land emits. If LPJ-specific ET is needed later, re-enable
  # under a distinct CMIP7 name (e.g. evspsblveg = canopy, or tran =
  # transpiration only).
  # - name: evspsbl_mon
