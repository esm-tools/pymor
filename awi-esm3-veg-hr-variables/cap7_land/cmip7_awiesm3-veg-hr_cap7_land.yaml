  # All from plain-text .out files: Lon/Lat/Year/Jan..Dec
  # model_variable = "Total" (single-column monthly format)

  # --- Carbon pools (10) ---

  - name: cLand_mon
    inputs:
      - path: *ldp
        pattern: "*/run1/cLand_monthly.out"
    compound_name: land.cLand.tavg-u-hxy-lnd.mon.GLB
    model_variable: Total
    source_units: "kg m-2"
    pipelines:
      - lpjg_monthly_pipeline

  - name: cLeaf_mon
