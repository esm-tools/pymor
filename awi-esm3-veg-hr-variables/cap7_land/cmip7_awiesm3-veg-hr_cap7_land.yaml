# CMIP7 CAP7 Land Variables — AWI-ESM3-VEG-HR
# Generated from cmip7_CAP7_variables_land.csv
#
# 98 total: 12 in core/lrcs/veg/extra, 54 new rules, 2 need new custom step,
# 30 blocked (per-PFT group, missing .out files, no depth-resolved cSoil).
# See cmip7_cap7_land_todo.md for full variable tracking.

general:
  name: "awiesm3-cmip7-cap7-land"
  cmor_version: "CMIP7"
  mip: "CMIP"
  CMIP7_DReq_metadata: "/home/a/a270092/.cache/pycmor/cmip7_metadata/v1.2.2.4/metadata.json"

pycmor:
  enable_output_subdirs: true
  warn_on_no_rule: False
  parallel: False
  dask_cluster: "slurm"
  dask_n_workers: 1
  dask_cluster_scaling_mode: "fixed"
  dask_cluster_scaling_fixed_jobs: 1

jobqueue:
  slurm:
    name: pycmor-worker
    queue: compute
    account: bb1469
    cores: 16
    memory: 256GB
    walltime: '00:30:00'

pipelines:
  # LPJ-GUESS monthly loader (Lon/Lat/Year/Jan..Dec format)
  - name: lpjg_monthly_pipeline
    steps:
      - script://$PYCMOR_HOME/examples/custom_steps.py:load_lpjguess_monthly
      - script://$PYCMOR_HOME/examples/custom_steps.py:clip_small_negatives
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.set_time_bounds
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset
      - pycmor.std_lib.qc.run_compliance_checker

  # added by LASZLO - 29.04.2026
  # LPJ-GUESS monthly depth-layered loader (Lon/Lat/Year/Mth/Depth0.1..Depth1.5 format)
  - name: lpjg_monthly_depth_pipeline
    steps:
      - script:///work/ab0246/a270092/software/pycmor/examples/custom_steps.py:load_lpjguess_monthly_depth
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.set_time_bounds
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset
      - pycmor.std_lib.qc.run_compliance_checker

  # LPJ-GUESS monthly + clip-floor-at-zero (for variables whose physical
  # floor is 0 but where the pipeline introduces small negatives;
  # currently used by rhSoil — raw .out has nneg==0 per Laszlo).
  - name: lpjg_monthly_clip0_pipeline
    steps:
      - script://$PYCMOR_HOME/examples/custom_steps.py:load_lpjguess_monthly
      - script://$PYCMOR_HOME/examples/custom_steps.py:clip_small_negatives
      - script://$PYCMOR_HOME/examples/custom_steps.py:clip_floor_zero
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.set_time_bounds
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset
      - pycmor.std_lib.qc.run_compliance_checker

  # LPJ-GUESS monthly depth + clip-floor-at-zero (currently used by mrsol).
  - name: lpjg_monthly_depth_clip0_pipeline
    steps:
      - script:///work/ab0246/a270092/software/pycmor/examples/custom_steps.py:load_lpjguess_monthly_depth
      - script://$PYCMOR_HOME/examples/custom_steps.py:clip_small_negatives
      - script://$PYCMOR_HOME/examples/custom_steps.py:clip_floor_zero
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.set_time_bounds
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset
      - pycmor.std_lib.qc.run_compliance_checker

  # LPJ-GUESS yearly→monthly broadcast (loads yearly stand-area file and
  # repeats each yearly value across 12 mid-month time stamps).
  # Used where the native monthly file is LAI/phenology-weighted and the
  # yearly file is the authoritative stand-area source; see
  # HANDOFF_d4_treeFrac_per_pft.md.
  - name: lpjg_yearly_to_monthly_pipeline
    steps:
      - script://$PYCMOR_HOME/examples/custom_steps.py:load_lpjguess_yearly
      - script://$PYCMOR_HOME/examples/custom_steps.py:broadcast_yearly_to_monthly
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.set_time_bounds
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset
      - pycmor.std_lib.qc.run_compliance_checker

  # added by LASZLO - 29.04.2026
  # LPJ-GUESS monthly carbon pool loader (Lon/Lat/Year/Mth/Fast/Medium/Slow format)
  - name: lpjg_monthly_pool_pipeline
    steps:
      - script:///work/ab0246/a270092/software/pycmor/examples/custom_steps.py:load_lpjguess_monthly_pool
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.set_time_bounds
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset
      - pycmor.std_lib.qc.run_compliance_checker

inherit:
  # Write-perf defaults rolled out from HR atm core bench:
  netcdf_write_scheduler: synchronous
  data_path: &dp /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/oifs
  lpjg_data_path: &ldp /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/lpj_guess
  # LPJ-GUESS reads plain-text .out files, so its rules have no netCDF
  # input to recover cell bounds from and cli109 shipped 165 land files
  # with none. Its 107132 points are exactly the land cells of the OIFS
  # TCo319 grid (matched against this file the worst separation is 9e-7
  # of a chord, and the mapping is 1:1), so the bounds come from there.
  # Written under the old run root on purpose: --data-path repointing
  # rewrites it along with every other path.
  bounds_reference_file: /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/oifs/atmos_mon_land_orog_*.nc
  source_id: AWI-ESM3-4-2-veg-HR
  institution_id: AWI
  institution: "Alfred Wegener Institute for Polar and Marine Research"
  experiment_id: piControl
  variant_label: r1i1p1f1
  # Parent/branch metadata: piControl branches from piControl-spinup
  # (CMIP7 experiment CV). The spinup ran 330 years on its own calendar
  # starting 1350-01-01, so the branch at its end is 1680-01-01.
  parent_time_units: "days since 1350-01-01"
  branch_time_in_parent: 120522.0
  grid_label: g122
  grid: "OpenIFS TCo319 reduced Gaussian (~25 km) — LPJ-GUESS on OIFS grid"
  nominal_resolution: "25 km"
  time_dimname: time_counter
  output_directory: ./cmorized_output/awiesm3
  # QC: in-pipeline CF + WCRP-CMIP7 compliance check on every saved file.
  qc_enabled: true
  qc_repack: true
  qc_tests: ["cf", "wcrp_cmip7", "aicc"]
  qc_checker_options: ["aicc:grid_config:/work/ab0246/a270092/software/pycmor/awi-esm3-veg-hr-variables/aicc_grid_config.json"]
  qc_ignore_codes: ["VAR004"]

  activity_id: CMIP
  parent_experiment_id: no parent
  calendar: proleptic_gregorian
