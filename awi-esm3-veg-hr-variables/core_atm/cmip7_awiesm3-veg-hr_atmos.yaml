# CMIP7 Core Atmosphere Variables — AWI-ESM3-VEG-HR
# Generated from cmip7_all_core_variables_atmos.csv
#
# Unit conversions (deaccumulation, sign flips, fraction→%) are handled by
# XIOS expressions in field_def_cmip7.xml at output time. Pycmor rules
# just read the output, set CMOR metadata, and save.

general:
  name: "awiesm3-cmip7-core-atmos"
  cmor_version: "CMIP7"
  mip: "CMIP"
  CMIP7_DReq_metadata: "/home/a/a270092/.cache/pycmor/cmip7_metadata/v1.2.2.3/metadata.json"

pycmor:
  warn_on_no_rule: False
  parallel: False
  dask_cluster: "slurm"
  dask_n_workers: 1
  dask_cluster_scaling_mode: "fixed"
  dask_cluster_scaling_fixed_jobs: 1

jobqueue:
  slurm:
    name: pycmor-worker
    queue: compute
    account: bb1469
    cores: 16
    memory: 256GB
    walltime: '00:30:00'

pipelines:
  - name: sfcwind_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:compute_sfcwind
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # hur on pressure levels: recompute from ta + hus using CMIP7 phase-
  # dependent saturation vapour pressure (water >=0 C, ice <0 C). IFS
  # FullPos `r` uses mixed-phase QSAT interpolation that is not CMIP7.
  - name: hur_plev_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:compute_hur_plev
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  - name: hurs_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:compute_hurs
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  - name: huss_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:compute_huss
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  - name: clwvi_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:compute_clwvi
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  - name: scale_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:scale_by_constant
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset

  # areacella: atmospheric grid-cell area, referenced by every atm variable
  # via cell_measures: area: areacella.
  - name: areacella_pipeline
    uses: pycmor.core.pipeline.AreacellaFxPipeline

inherit:
  # Tier-wide throttle: protect against the HDF5-write-lock parallel-save
  # wedge that timed out core_atm_3 in cli52 and reproduced under cli52
  # retry (3 saves zg/ta/va stuck at heartbeat #32 for 32 min on the
  # 3D pressure-level fields). Cap=1 via PYCMOR_THROTTLE_CAPS forces
  # strict serial; parallelism ratio was 1.27-2.15x on cli52 successful
  # shards so worst-case serial wall ~45 min (well inside 3h).
  throttle_group: core_atm_serial
  # Write-perf defaults rolled out from HR atm core bench:
  netcdf_compression_codec: blosc_zstd
  netcdf_compression_level: 3
  netcdf_write_scheduler: synchronous
  data_path: &dp /work/bb1469/a270092/runtime/awiesm3-develop/Final_CMIP7_IO_Test_01/outdata/oifs
  source_id: AWI-ESM-3
  institution_id: AWI
  experiment_id: picontrol
  variant_label: r1i1p1f1
  grid_label: gn
  grid: "OpenIFS TCo319 reduced Gaussian, interpolated to 0.25deg regular grid"
  nominal_resolution: "25 km"
  institution: "Alfred Wegener Institute, Helmholtz Centre for Polar and Marine Research, Bremerhaven, Germany"
  time_dimname: time_counter
  output_directory: ./cmorized_output/awiesm3

rules:
  # ============================================================
  # fx (time-invariant)
  # ============================================================

  # Atmospheric grid-cell area -- companion for every atm variable
  # that carries cell_measures: area: areacella.
  - name: areacella
    inputs:
      - path: *dp
        pattern: atmos_mon_rsdt_.*\.nc
    compound_name: atmos.areacella.ti-u-hxy-u.fx.glb
    model_variable: rsdt
    pipelines:
      - areacella_pipeline

  # ============================================================
  # Monthly 2D surface (Amon)
  # ============================================================

  # --- Radiation (TOA) ---

  - name: rsdt
    inputs:
      - path: *dp
        pattern: atmos_mon_rsdt_.*\.nc
    compound_name: atmos.rsdt.tavg-u-hxy-u.mon.glb
    model_variable: rsdt

  - name: rsut
    inputs:
      - path: *dp
        pattern: atmos_mon_rsut_.*\.nc
    compound_name: atmos.rsut.tavg-u-hxy-u.mon.glb
    model_variable: rsut

  - name: rsutcs
    inputs:
      - path: *dp
        pattern: atmos_mon_rsutcs_.*\.nc
    compound_name: atmos.rsutcs.tavg-u-hxy-u.mon.glb
    model_variable: rsutcs

  - name: rlut
    inputs:
      - path: *dp
        pattern: atmos_mon_rlut_.*\.nc
    compound_name: atmos.rlut.tavg-u-hxy-u.mon.glb
    model_variable: rlut

  - name: rlutcs
    inputs:
      - path: *dp
        pattern: atmos_mon_rlutcs_.*\.nc
    compound_name: atmos.rlutcs.tavg-u-hxy-u.mon.glb
    model_variable: rlutcs

  # --- Radiation (surface, all-sky) ---

  - name: rsds
    inputs:
      - path: *dp
        pattern: atmos_1h_sfc_rsds_.*\.nc
    compound_name: atmos.rsds.tavg-u-hxy-u.mon.glb
    model_variable: rsds

  - name: rsus
    inputs:
      - path: *dp
        pattern: atmos_1h_sfc_rsus_.*\.nc
    compound_name: atmos.rsus.tavg-u-hxy-u.mon.glb
    model_variable: rsus

  - name: rlds
    inputs:
      - path: *dp
        pattern: atmos_1h_sfc_rlds_.*\.nc
    compound_name: atmos.rlds.tavg-u-hxy-u.mon.glb
    model_variable: rlds

  - name: rlus
    inputs:
      - path: *dp
        pattern: atmos_1h_sfc_rlus_.*\.nc
    compound_name: atmos.rlus.tavg-u-hxy-u.mon.glb
    model_variable: rlus

  # --- Radiation (surface, clear-sky) — requires ssrdc/strdc in model output ---

  - name: rsdscs
    inputs:
      - path: *dp
        pattern: atmos_mon_rsdscs_.*\.nc
    compound_name: atmos.rsdscs.tavg-u-hxy-u.mon.glb
    model_variable: rsdscs

  - name: rsuscs
    inputs:
      - path: *dp
        pattern: atmos_mon_rsuscs_.*\.nc
    compound_name: atmos.rsuscs.tavg-u-hxy-u.mon.glb
    model_variable: rsuscs

  - name: rldscs
    inputs:
      - path: *dp
        pattern: atmos_mon_rldscs_.*\.nc
    compound_name: atmos.rldscs.tavg-u-hxy-u.mon.glb
    model_variable: rldscs

  - name: rluscs
    inputs:
      - path: *dp
        pattern: atmos_mon_rluscs_.*\.nc
    compound_name: atmos.rluscs.tavg-u-hxy-u.mon.glb
    model_variable: rluscs

  # --- Turbulent fluxes ---

  - name: hfls
    inputs:
      - path: *dp
        pattern: atmos_1h_sfc_hfls_.*\.nc
    compound_name: atmos.hfls.tavg-u-hxy-u.mon.glb
    model_variable: hfls

  - name: hfss
    inputs:
      - path: *dp
        pattern: atmos_1h_sfc_hfss_.*\.nc
    compound_name: atmos.hfss.tavg-u-hxy-u.mon.glb
    model_variable: hfss

  # --- Surface stress ---

  - name: tauu
    inputs:
      - path: *dp
        pattern: atmos_mon_tauu_.*\.nc
    compound_name: atmos.tauu.tavg-u-hxy-u.mon.glb
    model_variable: tauu

  - name: tauv
    inputs:
      - path: *dp
        pattern: atmos_mon_tauv_.*\.nc
    compound_name: atmos.tauv.tavg-u-hxy-u.mon.glb
    model_variable: tauv

  # --- Precipitation ---

  - name: pr
    inputs:
      - path: *dp
        pattern: atmos_1h_pr_pr_.*\.nc
    compound_name: atmos.pr.tavg-u-hxy-u.mon.glb
    model_variable: pr

  - name: prc
    inputs:
      - path: *dp
        pattern: atmos_mon_prc_.*\.nc
    compound_name: atmos.prc.tavg-u-hxy-u.mon.glb
    model_variable: prc

  - name: prsn
    inputs:
      - path: *dp
        pattern: atmos_3h_prsn_prsn_.*\.nc
    compound_name: atmos.prsn.tavg-u-hxy-u.mon.glb
    model_variable: prsn

  # --- Cloud, humidity, temperature, pressure ---

  - name: clt
    inputs:
      - path: *dp
        pattern: atmos_1h_sfc_clt_.*\.nc
    compound_name: atmos.clt.tavg-u-hxy-u.mon.glb
    model_variable: clt

  - name: tas
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_2t_.*\.nc
    compound_name: atmos.tas.tavg-h2m-hxy-u.mon.glb
    model_variable: 2t

  - name: ts
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_skt_.*\.nc
    compound_name: atmos.ts.tavg-u-hxy-u.mon.glb
    model_variable: skt

  - name: psl
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_msl_.*\.nc
    compound_name: atmos.psl.tavg-u-hxy-u.mon.glb
    model_variable: msl

  - name: ps
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_sp_.*\.nc
    compound_name: atmos.ps.tavg-u-hxy-u.mon.glb
    model_variable: sp

  - name: prw
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_tcwv_.*\.nc
    compound_name: atmos.prw.tavg-u-hxy-u.mon.glb
    model_variable: tcwv

  - name: clivi
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_tciw_.*\.nc
    compound_name: atmos.clivi.tavg-u-hxy-u.mon.glb
    model_variable: tciw

  - name: uas
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_10u_.*\.nc
    compound_name: atmos.uas.tavg-h10m-hxy-u.mon.glb
    model_variable: 10u

  - name: vas
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_10v_.*\.nc
    compound_name: atmos.vas.tavg-h10m-hxy-u.mon.glb
    model_variable: 10v

  # --- Computed variables (multi-input pipelines) ---

  - name: sfcWind
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_10u_.*\.nc
    compound_name: atmos.sfcWind.tavg-h10m-hxy-u.mon.glb
    model_variable: 10u
    second_input_path: *dp
    second_input_pattern: atm_remapped_1m_10v_.*\.nc
    second_variable: 10v
    pipelines:
      - sfcwind_pipeline

  - name: hurs
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_2t_.*\.nc
    compound_name: atmos.hurs.tavg-h2m-hxy-u.mon.glb
    model_variable: 2t
    second_input_path: *dp
    second_input_pattern: atm_remapped_1m_2d_.*\.nc
    second_variable: 2d
    pipelines:
      - hurs_pipeline

  - name: huss
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_2d_.*\.nc
    compound_name: atmos.huss.tavg-h2m-hxy-u.mon.glb
    model_variable: 2d
    second_input_path: *dp
    second_input_pattern: atm_remapped_1m_sp_.*\.nc
    second_variable: sp
    pipelines:
      - huss_pipeline

  - name: clwvi
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_tclw_.*\.nc
    compound_name: atmos.clwvi.tavg-u-hxy-u.mon.glb
    model_variable: tclw
    second_input_path: *dp
    second_input_pattern: atm_remapped_1m_tciw_.*\.nc
    second_variable: tciw
    pipelines:
      - clwvi_pipeline

  # --- Fixed (fx) variables ---

  - name: sftlf
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_lsm_.*\.nc
    compound_name: atmos.sftlf.ti-u-hxy-u.fx.glb
    model_variable: lsm
    scale_factor: 100.0
    scaled_units: "%"
    pipelines:
      - scale_pipeline

  # ============================================================
  # Monthly 3D on pressure levels (Amon, plev19)
  # ============================================================

  - name: ta
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_pl_t_.*\.nc
    compound_name: atmos.ta.tavg-p19-hxy-air.mon.glb
    model_variable: t
    lazy_write: true

  - name: ua
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_pl_u_.*\.nc
    compound_name: atmos.ua.tavg-p19-hxy-air.mon.glb
    model_variable: u
    lazy_write: true

  - name: va
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_pl_v_.*\.nc
    compound_name: atmos.va.tavg-p19-hxy-air.mon.glb
    model_variable: v
    lazy_write: true

  - name: hus
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_pl_q_.*\.nc
    compound_name: atmos.hus.tavg-p19-hxy-u.mon.glb
    model_variable: q
    lazy_write: true

  - name: wap
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_pl_w_.*\.nc
    compound_name: atmos.wap.tavg-p19-hxy-air.mon.glb
    model_variable: w
    lazy_write: true

  - name: zg
    inputs:
      - path: *dp
        pattern: atmos_mon_pl_zg_.*\.nc
    compound_name: atmos.zg.tavg-p19-hxy-air.mon.glb
    model_variable: zg
    lazy_write: true

  - name: hur
    inputs:
      - path: *dp
        pattern: atmos_mon_pl_ta_.*\.nc
    compound_name: atmos.hur.tavg-p19-hxy-air.mon.glb
    model_variable: ta
    second_input_path: *dp
    second_input_pattern: atmos_mon_pl_hus_.*\.nc
    second_variable: hus
    pipelines: [hur_plev_pipeline]
    lazy_write: true

  # ============================================================
  # Daily 2D surface (day)
  # ============================================================

  - name: clt_day
    inputs:
      - path: *dp
        pattern: atmos_1h_sfc_clt_.*\.nc
    compound_name: atmos.clt.tavg-u-hxy-u.day.glb
    model_variable: clt

  - name: rsds_day
    inputs:
      - path: *dp
        pattern: atmos_1h_sfc_rsds_.*\.nc
    compound_name: atmos.rsds.tavg-u-hxy-u.day.glb
    model_variable: rsds

  - name: pr_day
    inputs:
      - path: *dp
        pattern: atmos_1h_pr_pr_.*\.nc
    compound_name: atmos.pr.tavg-u-hxy-u.day.glb
    model_variable: pr

  - name: tas_day
    inputs:
      - path: *dp
        pattern: atm_remapped_1d_2t_.*\.nc
    compound_name: atmos.tas.tavg-h2m-hxy-u.day.glb
    model_variable: 2t

  - name: psl_day
    inputs:
      - path: *dp
        pattern: atm_remapped_1d_msl_.*\.nc
    compound_name: atmos.psl.tavg-u-hxy-u.day.glb
    model_variable: msl

  - name: ps_day
    inputs:
      - path: *dp
        pattern: atm_remapped_1d_sp_.*\.nc
    compound_name: atmos.ps.tavg-u-hxy-u.day.glb
    model_variable: sp

  - name: uas_day
    inputs:
      - path: *dp
        pattern: atm_remapped_1d_10u_.*\.nc
    compound_name: atmos.uas.tavg-h10m-hxy-u.day.glb
    model_variable: 10u

  - name: vas_day
    inputs:
      - path: *dp
        pattern: atm_remapped_1d_10v_.*\.nc
    compound_name: atmos.vas.tavg-h10m-hxy-u.day.glb
    model_variable: 10v

  - name: sfcWind_day
    inputs:
      - path: *dp
        pattern: atm_remapped_1d_10u_.*\.nc
    compound_name: atmos.sfcWind.tavg-h10m-hxy-u.day.glb
    model_variable: 10u
    second_input_path: *dp
    second_input_pattern: atm_remapped_1d_10v_.*\.nc
    second_variable: 10v
    pipelines:
      - sfcwind_pipeline

  - name: hurs_day
    inputs:
      - path: *dp
        pattern: atm_remapped_1d_2t_.*\.nc
    compound_name: atmos.hurs.tavg-h2m-hxy-u.day.glb
    model_variable: 2t
    second_input_path: *dp
    second_input_pattern: atm_remapped_1d_2d_.*\.nc
    second_variable: 2d
    pipelines:
      - hurs_pipeline

  - name: huss_day
    inputs:
      - path: *dp
        pattern: atm_remapped_1d_2d_.*\.nc
    compound_name: atmos.huss.tavg-h2m-hxy-u.day.glb
    model_variable: 2d
    second_input_path: *dp
    second_input_pattern: atm_remapped_1d_sp_.*\.nc
    second_variable: sp
    pipelines:
      - huss_pipeline

  # ============================================================
  # Daily 3D on pressure levels (day, plev19)
  # ============================================================

  # Compression DISABLED on these 7 daily 3D pressure-level rules.
  # Measured zstd ratio on real wap_day_p19 data = 1.22× at every level
  # — high-entropy atmospheric data, compression buys ~18% disk for
  # significant CPU cost. cli53 _4 stalled on wap_day / va_day saves
  # (~6935 chunks of 3.3 MB each, sequential through the HDF5 lock,
  # ~0.32 s/chunk of pure compress at blosc_zstd:3). Disabling
  # compression removes that CPU bottleneck; files grow ~22%.
  - name: ta_day
    inputs:
      - path: *dp
        pattern: atm_remapped_1d_pl_t_.*\.nc
    compound_name: atmos.ta.tavg-p19-hxy-air.day.glb
    model_variable: t
    netcdf_enable_compression: false
    lazy_write: true

  - name: ua_day
    inputs:
      - path: *dp
        pattern: atm_remapped_1d_pl_u_.*\.nc
    compound_name: atmos.ua.tavg-p19-hxy-air.day.glb
    model_variable: u
    netcdf_enable_compression: false
    lazy_write: true

  - name: va_day
    inputs:
      - path: *dp
        pattern: atm_remapped_1d_pl_v_.*\.nc
    compound_name: atmos.va.tavg-p19-hxy-air.day.glb
    model_variable: v
    netcdf_enable_compression: false
    lazy_write: true

  - name: hus_day
    inputs:
      - path: *dp
        pattern: atm_remapped_1d_pl_q_.*\.nc
    compound_name: atmos.hus.tavg-p19-hxy-u.day.glb
    model_variable: q
    netcdf_enable_compression: false
    lazy_write: true

  - name: wap_day
    inputs:
      - path: *dp
        pattern: atm_remapped_1d_pl_w_.*\.nc
    compound_name: atmos.wap.tavg-p19-hxy-u.day.glb
    model_variable: w
    netcdf_enable_compression: false
    lazy_write: true

  - name: zg_day
    inputs:
      - path: *dp
