# Test data registry for pycmor
#
# This file defines all remote test data files that can be downloaded
# and cached by the test suite using pooch.
#
# Each entry represents a tarball containing directory structures
# exactly as they appear on the HPC systems.
#
# Format:
#   filename:
#     url: <download URL>
#     sha256: <checksum or null>
#     description: <human-readable description>
#     extract_dir: <directory name after extraction>

